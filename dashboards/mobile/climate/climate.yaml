type: custom:vertical-layout
title: Climate
path: climate
theme: Catppuccin Auto Latte Mocha Dashboard
subview: true
layout: !include /config/dashboards/templates/includes/layouts/app_page_layout.yaml
cards:
  #
  # Chips
  #
  - type: custom:mushroom-chips-card
    card_mod: !include /config/dashboards/templates/includes/card_mod/chips/app_chip_scroll_row.yaml
    chips:
      - type: template
        entity: climate.master_bedroom_aircon
        icon: "{{ {'heat_cool':'mdi:sun-snowflake-variant','heat':'mdi:heat-wave','cool':'mdi:snowflake','dry':'mdi:water-percent','fan_only':'mdi:fan'}.get(states('climate.master_bedroom_aircon'), 'mdi:air-conditioner') }}"
        icon_color: "{{ {'heat_cool':'teal','heat':'red','cool':'blue','dry':'cyan','fan_only':'green'}.get(states('climate.master_bedroom_aircon'), 'grey') }}"
        content: "{% set s = states('climate.master_bedroom_aircon') %}{% set t = state_attr('climate.master_bedroom_aircon','temperature') or state_attr('climate.master_bedroom_aircon','current_temperature') %}{{ {'heat_cool':'Auto','heat':'Heat','cool':'Cool','dry':'Dry','fan_only':'Fan','off':'Off','unavailable':'Offline'}.get(s, s) }}{{ (' · ' ~ (t | round(0) | int) ~ '°') if (t and s not in ['off','unavailable']) else '' }}"
        tap_action:
          action: more-info
      - type: entity
        entity: fan.zhimi_vb4_00ae_air_purifier
        content_info: state
        tap_action:
          action: more-info
        hold_action:
          action: more-info
      - type: template
        entity: sensor.master_bedroom_aircon_outside
        icon: mdi:weather-partly-cloudy
        content: "{% set v = states('sensor.master_bedroom_aircon_outside') | float(none) %}{{ (v | round(1) ~ '°') if v is not none else '—' }}"
        tap_action:
          action: more-info

  #
  # Current weather
  #
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: weather.openweathermap
    name: Outside
    show_state: true
    tap_action:
      action: more-info
    sub_button:
      - entity: sensor.master_bedroom_aircon_outside
        state_background: false
        icon: mdi:thermometer
        show_state: true
        tap_action:
          action: more-info
      - entity: weather.openweathermap
        icon: mdi:water-percent
        state_background: false
        show_state: false
        show_attribute: true
        attribute: humidity
        tap_action:
          action: more-info
    styles: |
      ${card.querySelector('.bubble-icon')?.setAttribute('icon', getWeatherIcon(hass.states['weather.openweathermap'].state))}
      .bubble-icon { color: var(--primary-color) !important; }
      .bubble-icon-container { background-color: color-mix(in srgb, var(--primary-color) 20%, transparent) !important; }
      .bubble-sub-button.background-on, .bubble-sub-button.background-on ha-icon, .bubble-sub-button.background-on .bubble-sub-button-icon { color: var(--primary-color); }

  #
  # Living room climate
  #
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: sensor.zhimi_vb4_00ae_temperature
    name: Living Room
    icon: mdi:home-thermometer
    show_state: true
    tap_action:
      action: more-info
    sub_button:
      - entity: sensor.zhimi_vb4_00ae_relative_humidity
        state_background: false
        icon: mdi:water-percent
        show_state: true
        tap_action:
          action: more-info
      - entity: sensor.zhimi_vb4_00ae_pm25_density
        state_background: false
        icon: mdi:blur
        show_state: true
        tap_action:
          action: more-info
      - entity: sensor.zhimi_vb4_00ae_air_quality
        state_background: false
        icon: mdi:leaf
        show_state: true
        tap_action:
          action: more-info
    styles: |
      .bubble-icon { color: var(--primary-color) !important; }
      .bubble-icon-container { background-color: color-mix(in srgb, var(--primary-color) 20%, transparent) !important; }
      .bubble-sub-button.background-on, .bubble-sub-button.background-on ha-icon, .bubble-sub-button.background-on .bubble-sub-button-icon { color: var(--primary-color); }

  #
  # Aircon: one Mushroom climate card per unit, named by room
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Aircon
  - type: custom:mushroom-climate-card
    entity: climate.master_bedroom_aircon
    name: Master Bedroom
    hvac_modes:
      - cool
      - dry
      - fan_only
      - heat_cool
      - "off"
    show_temperature_control: true
    collapsible_controls: true
    tap_action:
      action: more-info
    features:
      - type: climate-fan-modes
        style: dropdown

  #
  # Devices
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Devices
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-fan-card
        entity: fan.dmaker_p33_c4d3_fan
        name: Living Room Fan
        icon_animation: true
        show_percentage_control: true
        collapsible_controls: true
        fill_container: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        features:
          - type: fan-preset-modes
            style: dropdown
      - type: custom:mushroom-fan-card
        entity: fan.dmaker_p15_03db_fan
        name: Bedroom Fan
        icon_animation: true
        show_percentage_control: true
        collapsible_controls: true
        fill_container: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        features:
          - type: fan-preset-modes
            style: dropdown
      - type: custom:mushroom-entity-card
        entity: fan.zhimi_vb4_00ae_air_purifier
        name: Air Purifier
        secondary_info: state
        fill_container: true
        tap_action:
          action: more-info
        hold_action:
          action: more-info

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml
