type: custom:vertical-layout
title: Climate
path: climate
theme: Catppuccin Mocha Dashboard
subview: true
layout: !include /config/dashboards/templates/includes/layouts/app_page_layout.yaml
cards:
  - type: custom:decluttering-card
    template: top_toolbar
    variables:
      - cards:
        - type: custom:button-card
          template: empty_column
        - type: custom:button-card
          template: app_header_page_title
          name: Climate
        - type: custom:button-card
          template: empty_column

  #
  # Chips
  #
  - type: custom:mod-card
    style: !include /config/dashboards/templates/includes/card_mod/chips/page_chip_layout.yaml
    card:
      type: horizontal-stack
      cards:
        - type: custom:button-card
          template: app_ac_chip
          entity: climate.master_bedroom_aircon
        - type: custom:button-card
          template: app_device_chip
          entity: fan.zhimi_vb4_00ae_air_purifier
          icon: mdi:air-purifier
        - type: custom:button-card
          template: app_temperature_chip
          entity: sensor.masterbedroom_aircon_outside
          icon: mdi:weather-partly-cloudy

  #
  # Current weather
  #
  - type: weather-forecast
    show_current: true
    show_forecast: false
    name: Outside
    entity: weather.openweathermap

  #
  # Living room climate
  #
  - type: custom:decluttering-card
    template: climate_overview_simple
    variables:
      - title: Living Room Climate
      - temperature_sensor: sensor.zhimi_vb4_00ae_temperature
      - items:
        - type: custom:button-card
          entity: sensor.zhimi_vb4_00ae_relative_humidity
          template: app_aqi_humidity_item
        - type: custom:button-card
          entity: sensor.zhimi_vb4_00ae_pm25_density
          template: app_aqi_pm25_item
        - type: custom:button-card
          entity: sensor.zhimi_vb4_00ae_air_quality
          template: app_aqi_text_item

  #
  # Master bedroom aircon
  #
  - type: custom:button-card
    template: section_title
    name: Master Bedroom Aircon
  - type: thermostat
    entity: climate.master_bedroom_aircon
    name: Aircon
    features:
      - type: climate-hvac-modes
        style: icons
        hvac_modes:
          - cool
          - dry
          - fan_only
          - heat_cool
          - "off"
      - type: climate-fan-modes
        style: dropdown
        fan_modes:
          - auto
          - Night
          - low
          - Low-Medium
          - medium
          - Medium-High
          - high

  #
  # 24h temperatures
  #
  - type: custom:button-card
    template: section_title
    name: Last 24 Hours
  - type: custom:mini-graph-card
    name: Temperature
    icon: mdi:thermometer
    hours_to_show: 24
    points_per_hour: 2
    line_width: 3
    smoothing: true
    show:
      legend: true
      labels: true
    entities:
      - entity: sensor.zhimi_vb4_00ae_temperature
        name: Living Room
        color: "#89b4fa"
      - entity: sensor.masterbedroom_aircon_ac_home
        name: Master Bedroom
        color: "#f9e2af"
      - entity: sensor.masterbedroom_aircon_outside
        name: Outside
        color: var(--secondary-text-color)
    card_mod: !include /config/dashboards/templates/includes/card_mod/climate_card/app_climate_card_graph_styles.yaml

  - type: custom:mini-graph-card
    name: Air Quality (PM2.5)
    icon: mdi:blur
    hours_to_show: 24
    points_per_hour: 2
    line_width: 3
    smoothing: true
    show:
      labels: true
    color_thresholds:
      - color: "#a6e3a1"
        value: 0
      - color: "#f9e2af"
        value: 12
      - color: "#fab387"
        value: 35
      - color: "#f38ba8"
        value: 55
    entities:
      - entity: sensor.zhimi_vb4_00ae_pm25_density
        name: PM2.5
    card_mod: !include /config/dashboards/templates/includes/card_mod/climate_card/app_climate_card_graph_styles.yaml

  #
  # Devices
  #
  - type: custom:button-card
    template: section_title
    name: Devices
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        entity: fan.zhimi_vb4_00ae_air_purifier
        name: Air Purifier
        template: app_device_air_purifier_entity
        tap_action:
          action: toggle
          haptic: light
        hold_action:
          action: more-info
      - type: custom:button-card
        entity: fan.dmaker_p33_c4d3_fan
        name: Living Room Fan
        template: app_fan_entity
        tap_action:
          action: toggle
          haptic: light
        hold_action:
          action: more-info
      - type: custom:button-card
        entity: fan.dmaker_p15_03db_fan
        name: Bedroom Fan
        template: app_fan_entity
        tap_action:
          action: toggle
          haptic: light
        hold_action:
          action: more-info
      - type: custom:button-card
        entity: sensor.zhimi_vb4_00ae_filter_left_time
        name: Purifier Filter
        template: app_value_entity
        icon: mdi:air-filter

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml
