#
# Upcoming TV popup
#
- type: custom:bubble-card
  card_type: pop-up
  hash: '#upcoming_tv'
  close_by_clicking_outside: true
  styles: !include /config/dashboards/templates/includes/app_popup_styles.yaml
  margin_top_mobile: calc(100vh - 760px)
  margin_top_desktop: calc(100vh - 760px)
  cards:
    - type: custom:button-card
      template: app_popup_page_title
      name: Upcoming TV
    - type: custom:upcoming-media-card
      entity: sensor.sonarr_upcoming_media
      image_style: fanart
      all_shadows: false
      hide_flagged: true
      card_mod:
        style: |
          .sona_fanart {
            background-position: center!important;
            background-size: cover!important;
            border-radius: 8px;
          }
          .sona_fan_fanart {
            background: linear-gradient(to right, hsl(0deg 0% 0% / 50%) 48%, transparent 70%, #000 100%)!important;
            box-shadow: none!important;
          }
