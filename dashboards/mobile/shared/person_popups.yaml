#
# Person 1 popup
#
- type: custom:bubble-card
  card_type: pop-up
  hash: '#person1'
  entity: person.person1
  name: Person 1
  button_type: state
  # The header shows the room (sensor.person1_location) instead of the person's plain home/away.
  show_state: false
  sub_button:
    - entity: sensor.person1_location
      show_state: true
      state_background: false
      tap_action:
        action: more-info
  show_header: true
  close_by_clicking_outside: true
  styles: !include /config/dashboards/templates/includes/app_popup_styles.yaml
  margin_top_mobile: max(0px, calc(100vh - 760px))
  margin_top_desktop: max(0px, calc(100vh - 760px))
  cards:
    - type: map
      entities:
        - device_tracker.person1_galaxy_z_fold8_ultra_person1_z_fold8_ultra
      hours_to_show: 24
      default_zoom: 14
      auto_fit: true
      theme_mode: dark
    - type: custom:decluttering-card
      template: section_title
      variables:
        - title: Devices
    - type: grid
      columns: 2
      square: false
      cards:
        - type: custom:mushroom-entity-card
          entity: sensor.person1_galaxy_z_fold8_ultra_person1_z_fold8_ultra_battery_level
          name: Battery
          fill_container: true
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: switch.desktop1_pc_wake_on_lan
          name: Gaming PC
          secondary_info: last-changed
          fill_container: true
          tap_action:
            action: toggle
          hold_action:
            action: more-info

