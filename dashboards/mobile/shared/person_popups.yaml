#
# Person 1 popup
#
- type: custom:bubble-card
  card_type: pop-up
  hash: '#person1'
  entity: person.person1
  name: Person 1
  button_type: state
  show_state: true
  show_header: true
  close_by_clicking_outside: true
  styles: !include /config/dashboards/templates/includes/app_popup_styles.yaml
  margin_top_mobile: max(0px, calc(100vh - 760px))
  margin_top_desktop: max(0px, calc(100vh - 760px))
  cards:
    - type: map
      entities:
        - device_tracker.person1_phone
      hours_to_show: 24
      default_zoom: 14
      auto_fit: true
      theme_mode: dark
    - type: custom:decluttering-card
      template: section_title
      variables:
        - title: Devices
    - type: grid
      columns: 2
      square: false
      cards:
        - type: custom:mushroom-entity-card
          entity: sensor.person1_phone_battery_level
          name: Battery
          fill_container: true
          tap_action:
            action: more-info
        - type: custom:mushroom-entity-card
          entity: switch.desktop1_pc
          name: Gaming PC
          secondary_info: last-changed
          fill_container: true
          tap_action:
            action: toggle
          hold_action:
            action: more-info

