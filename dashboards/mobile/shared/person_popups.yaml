#
# Upcoming TV popup: the full Sonarr list with fanart
#
- type: custom:bubble-card
  card_type: pop-up
  hash: '#upcoming_tv'
  name: Upcoming TV
  icon: mdi:youtube-tv
  show_header: true
  close_by_clicking_outside: true
  styles: !include /config/dashboards/templates/includes/app_popup_styles.yaml
  margin_top_mobile: max(0px, calc(100vh - 760px))
  margin_top_desktop: max(0px, calc(100vh - 760px))
  cards:
    - type: custom:upcoming-media-card
      entity: sensor.sonarr_upcoming_media
      image_style: fanart
      all_shadows: false
      hide_flagged: true
      card_mod:
        style: |
          .sona_fanart {
            background-position: center!important;
            background-size: cover!important;
            border-radius: 8px;
          }
          .sona_fan_fanart {
            background: linear-gradient(to right, hsl(0deg 0% 0% / 50%) 48%, transparent 70%, #000 100%)!important;
            box-shadow: none!important;
          }
