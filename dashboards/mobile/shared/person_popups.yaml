#
# Upcoming TV popup: the full Sonarr list with fanart
#
- type: custom:bubble-card
  card_type: pop-up
  hash: '#upcoming_tv'
  name: Upcoming TV
  icon: mdi:youtube-tv
  show_header: true
  close_by_clicking_outside: true
  styles: !include /config/dashboards/templates/includes/app_popup_styles.yaml
  margin_top_mobile: max(0px, calc(100vh - 760px))
  margin_top_desktop: max(0px, calc(100vh - 760px))
  cards:
    - type: custom:upcoming-media-card
      entity: sensor.sonarr_upcoming_media
      image_style: fanart
      all_shadows: false
      hide_flagged: true
      card_mod:
        style: |
          .sona_fanart {
            background-position: center!important;
            background-size: cover!important;
            border-radius: 8px;
          }
          .sona_fan_fanart {
            background: linear-gradient(to right, hsl(0deg 0% 0% / 50%) 48%, transparent 70%, #000 100%)!important;
            box-shadow: none!important;
          }

#
# Lights popup: the all-lights group, grouped by floor then room (auto-entities per room)
#
- type: custom:bubble-card
  card_type: pop-up
  hash: '#lights'
  entity: light.all_lights
  name: Lights
  icon: mdi:lightbulb-group
  button_type: state
  show_state: true
  show_header: true
  close_by_clicking_outside: true
  styles: !include /config/dashboards/templates/includes/app_popup_styles.yaml
  margin_top_mobile: max(0px, calc(100vh - 760px))
  margin_top_desktop: max(0px, calc(100vh - 760px))
  cards:
    - type: custom:decluttering-card
      template: section_title
      variables:
        - title: Second Floor
    - type: custom:mushroom-title-card
      subtitle: Master Bedroom
    - type: custom:auto-entities
      show_empty: false
      card:
        type: grid
        columns: 1
        square: false
      card_param: cards
      filter:
        include:
          - group: light.all_lights
            area: master_bedroom
            options:
              type: custom:mushroom-light-card
              show_brightness_control: true
              collapsible_controls: true
              tap_action:
                action: toggle
              hold_action:
                action: more-info
        exclude:
          - state: unavailable
    - type: custom:mushroom-title-card
      subtitle: Bedroom
    - type: custom:auto-entities
      show_empty: false
      card:
        type: grid
        columns: 1
        square: false
      card_param: cards
      filter:
        include:
          - group: light.all_lights
            area: bedroom
            options:
              type: custom:mushroom-light-card
              show_brightness_control: true
              collapsible_controls: true
              tap_action:
                action: toggle
              hold_action:
                action: more-info
        exclude:
          - state: unavailable
    - type: custom:mushroom-title-card
      subtitle: Master Bathroom
    - type: custom:auto-entities
      show_empty: false
      card:
        type: grid
        columns: 1
        square: false
      card_param: cards
      filter:
        include:
          - group: light.all_lights
            area: bathroom
            options:
              type: custom:mushroom-light-card
              show_brightness_control: true
              collapsible_controls: true
              tap_action:
                action: toggle
              hold_action:
                action: more-info
        exclude:
          - state: unavailable

#
# Fans popup: the standing fans by floor then room (the purifier has its own place)
#
- type: custom:bubble-card
  card_type: pop-up
  hash: '#fans'
  name: Fans
  icon: mdi:fan
  show_header: true
  close_by_clicking_outside: true
  styles: !include /config/dashboards/templates/includes/app_popup_styles.yaml
  margin_top_mobile: max(0px, calc(100vh - 760px))
  margin_top_desktop: max(0px, calc(100vh - 760px))
  cards:
    - type: custom:decluttering-card
      template: section_title
      variables:
        - title: First Floor
    - type: custom:mushroom-title-card
      subtitle: Living Room
    - type: custom:auto-entities
      show_empty: false
      card:
        type: grid
        columns: 1
        square: false
      card_param: cards
      filter:
        include:
          - domain: fan
            area: main_room
            options:
              type: custom:mushroom-fan-card
              icon_animation: true
              show_percentage_control: true
              collapsible_controls: true
              tap_action:
                action: toggle
              hold_action:
                action: more-info
              features:
                - type: fan-preset-modes
                  style: dropdown
        exclude:
          - entity_id: fan.zhimi_vb4_00ae_air_purifier
          - state: unavailable
      sort:
        method: name
    - type: custom:decluttering-card
      template: section_title
      variables:
        - title: Second Floor
    - type: custom:mushroom-title-card
      subtitle: Bedroom
    - type: custom:auto-entities
      show_empty: false
      card:
        type: grid
        columns: 1
        square: false
      card_param: cards
      filter:
        include:
          - domain: fan
            area: bedroom
            options:
              type: custom:mushroom-fan-card
              icon_animation: true
              show_percentage_control: true
              collapsible_controls: true
              tap_action:
                action: toggle
              hold_action:
                action: more-info
              features:
                - type: fan-preset-modes
                  style: dropdown
        exclude:
          - entity_id: fan.zhimi_vb4_00ae_air_purifier
          - state: unavailable
      sort:
        method: name
