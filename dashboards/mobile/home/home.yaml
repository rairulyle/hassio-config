type: custom:vertical-layout
title: Home
path: home
theme: Catppuccin Mocha Dashboard
layout: !include /config/dashboards/templates/includes/layouts/app_page_layout.yaml
cards:
  #
  # Page Header
  #
  - type: custom:decluttering-card
    template: top_toolbar
    variables:
      - cards:
        - type: custom:button-card
          template: empty_column
        - type: custom:button-card
          template: app_header_page_title
          name: Home
        - type: custom:button-card
          template: app_header_chip_card
          icon: mdi:youtube-tv
          icon_color: var(--secondary-text-color)
          tap_action:
            action: navigate
            navigation_path: '#upcoming_tv'
            haptic: light

  #
  # Quick overview: aircon + lights chips, people on the right
  #
  - type: custom:mod-card
    card_mod: !include /config/dashboards/templates/includes/card_mod/app_layout_card_mod.yaml
    card:
      type: custom:layout-card
      layout_type: custom:grid-layout
      layout:
        grid-template-columns: 65% 35%
        margin: 0px 0px 0px 0px
        padding: 0px
        card_margin: 0px
        gap: 5px
      cards:
        - type: custom:mod-card
          card_mod:
            style:
              hui-horizontal-stack-card$: |
                #root {
                  gap: 5px !important;
                }
          card:
            type: horizontal-stack
            cards:
              - type: custom:button-card
                template: app_ac_chip
                entity: climate.master_bedroom_aircon
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/climate
                  haptic: light
              - type: custom:button-card
                template: app_lights_chip
                entity: light.all_lights
                variables:
                  lights:
                    - light.master_bedroom_main_left_light
                    - light.master_bedroom_main_center_light
                    - light.master_bedroom_main_right_light
                    - light.master_bedroom_window_light
                    - light.bedroom_door_light
                    - light.bedroom_window_light
                    - light.bedroom_cabinet_left_light
                    - light.bedroom_cabinet_right_light
                    - light.master_bathroom_shower_light
                    - light.master_bathroom_door_light
                tap_action:
                  action: navigate
                  navigation_path: /lovelace/rooms
                  haptic: light

        - type: custom:mod-card
          card_mod:
            style:
              hui-horizontal-stack-card$: |
                #root {
                  display: flex;
                  justify-content: flex-end;
                  align-items: start;
                  gap: 6px;
                }
              .: |
                ha-card {
                  height: 100% !important;
                  align-self: center !important;
                }
          card:
            type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: person.person1
                template: app_person_entity
                tap_action:
                  action: navigate
                  navigation_path: '#person1'
                  haptic: light
              - type: custom:button-card
                entity: person.person2
                template: app_person_entity
                tap_action:
                  action: navigate
                  navigation_path: '#person2'
                  haptic: light

  #
  # Climate overview (living room sensors + outside temperature)
  #
  - type: custom:decluttering-card
    template: climate_overview_simple
    variables:
      - title: Indoor Climate
      - temperature_sensor: sensor.zhimi_vb4_00ae_temperature
      - items:
        - type: custom:button-card
          entity: sensor.zhimi_vb4_00ae_relative_humidity
          template: app_aqi_humidity_item
        - type: custom:button-card
          entity: sensor.zhimi_vb4_00ae_pm25_density
          template: app_aqi_pm25_item
        - type: custom:button-card
          entity: sensor.zhimi_vb4_00ae_air_quality
          template: app_aqi_text_item
        - type: custom:button-card
          entity: sensor.masterbedroom_aircon_outside
          template: app_aqi_temperature_item

  #
  # Overview
  #
  - type: custom:button-card
    template: section_title
    name: Overview

  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        entity: light.master_bedroom_lights
        name: Lights
        template: app_light_entity
        state_display: >
          [[[
            const ids = ['light.master_bedroom_main_left_light','light.master_bedroom_main_center_light','light.master_bedroom_main_right_light','light.master_bedroom_window_light','light.bedroom_door_light','light.bedroom_window_light','light.bedroom_cabinet_left_light','light.bedroom_cabinet_right_light','light.master_bathroom_shower_light','light.master_bathroom_door_light'];
            const n = ids.filter(id => states[id] && states[id].state == 'on').length;
            return n > 0 ? `${n} Lights On` : 'Off';
          ]]]
        styles:
          icon:
            - color: >
                [[[
                  const ids = ['light.master_bedroom_main_left_light','light.master_bedroom_main_center_light','light.master_bedroom_main_right_light','light.master_bedroom_window_light','light.bedroom_door_light','light.bedroom_window_light','light.bedroom_cabinet_left_light','light.bedroom_cabinet_right_light','light.master_bathroom_shower_light','light.master_bathroom_door_light'];
                  return ids.some(id => states[id] && states[id].state == 'on') ? 'var(--accent-color)' : 'var(--light-grey-color)';
                ]]]
        tap_action:
          action: navigate
          navigation_path: /lovelace/rooms
          haptic: light

      - type: custom:button-card
        entity: climate.master_bedroom_aircon
        name: Aircon
        template: app_ac_entity
        tap_action:
          action: navigate
          navigation_path: /lovelace/climate
          haptic: light

      - type: custom:button-card
        entity: fan.zhimi_vb4_00ae_air_purifier
        name: Air Purifier
        template: app_device_air_purifier_entity
        tap_action:
          action: navigate
          navigation_path: /lovelace/rooms-living-room
          haptic: light

      - type: custom:button-card
        entity: fan.dmaker_p33_c4d3_fan
        name: Living Room Fan
        template: app_fan_entity

      - type: custom:button-card
        entity: fan.dmaker_p15_03db_fan
        name: Bedroom Fan
        template: app_fan_entity

      - type: custom:button-card
        entity: switch.xiaomi_iv02_f7b6_pet_drinking_fountain
        name: Pet Fountain
        template: app_toggle_entity
        icon: mdi:fountain
        state_display: >
          [[[
            const st = states['sensor.xiaomi_iv02_f7b6_status'];
            const s = st ? st.state : entity.state;
            return s.charAt(0).toUpperCase() + s.slice(1) + ` - ${variables.last_changed}`;
          ]]]
        tap_action:
          action: navigate
          navigation_path: /lovelace/pets
          haptic: light

      - type: custom:button-card
        entity: sensor.speedtest_download
        name: Internet
        template: app_device_entity
        icon: app:app-wifi
        state_display: >
          [[[
            const ping = states['sensor.speedtest_ping'] ? states['sensor.speedtest_ping'].state : '?';
            return `${Math.round(parseFloat(entity.state))} Mbps · ${ping} ms`;
          ]]]
        tap_action:
          action: navigate
          navigation_path: /lovelace/system
          haptic: light

      - type: conditional
        conditions:
          - condition: state
            entity: vacuum.ijai_v3_aaa0_robot_cleaner
            state_not: unavailable
        card:
          type: custom:button-card
          entity: vacuum.ijai_v3_aaa0_robot_cleaner
          name: Robot Vacuum
          template: app_device_entity
          icon: mdi:robot-vacuum

  #
  # Quick Settings
  #
  - type: custom:button-card
    template: section_title
    name: Quick Settings
  - type: entities
    card_mod: !include /config/dashboards/templates/includes/card_mod/base/app_vertical_stack.yaml
    entities:
      - entity: automation.feed_cats
        name: Scheduled Feeding
        icon: mdi:cat
        card_mod: !include /config/dashboards/templates/includes/app_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true
      - entity: automation.notify_feed_cat1_and_cat2
        name: Feeding Reminders
        icon: app:app-notification
        card_mod: !include /config/dashboards/templates/includes/app_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true
      - entity: automation.notify_ohayou_gozaimasu
        name: Morning Greeting
        icon: app:app-announcement
        card_mod: !include /config/dashboards/templates/includes/app_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true
      - entity: automation.auto_theme_switch
        name: Auto Theme Switch
        icon: mdi:theme-light-dark
        card_mod: !include /config/dashboards/templates/includes/app_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true
      - entity: switch.cloud_remote
        name: Remote Access
        icon: mdi:cloud-outline
        card_mod: !include /config/dashboards/templates/includes/app_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml

  #
  # Popups
  #
  - type: vertical-stack
    cards: !include /config/dashboards/mobile/shared/person_popups.yaml
