type: custom:vertical-layout
title: Home
path: home
theme: Catppuccin Auto Latte Mocha Dashboard
layout: !include /config/dashboards/templates/includes/layouts/app_homepage_layout.yaml
cards:
  #
  # Household header: the glance chips, then the two residents
  #
  - type: custom:mushroom-chips-card
    card_mod: !include /config/dashboards/templates/includes/card_mod/chips/app_chip_scroll_row.yaml
    chips:
      - type: template
        entity: climate.master_bedroom_aircon
        icon: "{% from 'aircon.jinja' import aircon_icon %}{{ aircon_icon('climate.master_bedroom_aircon') }}"
        icon_color: "{% from 'state_color.jinja' import state_color %}{{ state_color('climate.master_bedroom_aircon') }}"
        content: "{% from 'aircon.jinja' import aircon_label %}{{ aircon_label('climate.master_bedroom_aircon') }} ›"
        tap_action:
          action: navigate
          navigation_path: /lovelace/rooms-master-bedroom
        hold_action:
          action: more-info
      - type: action
        icon: mdi:lightbulb-group
        icon_color: amber
        tap_action:
          action: navigate
          navigation_path: "#lights"
      - type: template
        entity: lock.master_bedroom_door
        icon: "{{ 'mdi:lock' if is_state('lock.master_bedroom_door','locked') else ('mdi:lock-question' if is_state('lock.master_bedroom_door','unavailable') else 'mdi:lock-open-variant') }}"
        icon_color: "{% from 'state_color.jinja' import state_color %}{{ state_color('lock.master_bedroom_door') }}"
        content: "{{ {'locked':'Locked','unlocked':'Unlocked','locking':'Locking…','unlocking':'Unlocking…','jammed':'Jammed','open':'Open'}.get(states('lock.master_bedroom_door'), 'Offline') }}"
        tap_action:
          action: more-info

  #
  # Greeting: time of day, the signed-in resident, the weather outside, and a Meteocons illustration on the right (www/dashboard/weather, MIT)
  #
  - type: markdown
    content: |
      {%- set h = now().hour -%}
      {%- set g = 'Good night' if h < 5 or h >= 22 else ('Good morning' if h < 12 else ('Good afternoon' if h < 18 else 'Good evening')) -%}
      {%- set w = states('weather.openweathermap') -%}
      {%- set words = {'sunny': 'Sunny', 'clear-night': 'Clear skies', 'partlycloudy': 'Partly cloudy', 'cloudy': 'Cloudy', 'rainy': 'Rainy', 'pouring': 'Pouring rain', 'lightning': 'Stormy', 'lightning-rainy': 'Stormy', 'fog': 'Foggy', 'windy': 'Windy', 'windy-variant': 'Windy', 'snowy': 'Snowy', 'snowy-rainy': 'Sleet', 'hail': 'Hail'} -%}
      {%- set night = is_state('sun.sun', 'below_horizon') -%}
      {%- set art = {'sunny': 'clear-day', 'clear-night': 'clear-night', 'partlycloudy': ('partly-cloudy-night' if night else 'partly-cloudy-day'), 'cloudy': 'overcast', 'rainy': 'rain', 'pouring': 'extreme-rain', 'lightning': 'thunderstorms', 'lightning-rainy': 'thunderstorms-rain', 'fog': 'fog', 'windy': 'wind', 'windy-variant': 'wind', 'snowy': 'snow', 'snowy-rainy': 'sleet', 'hail': 'hail'} -%}
      {%- set t = states('sensor.master_bedroom_aircon_outside') | float(none) -%}
      {% if w in art %}<img src="/local/dashboard/weather/{{ art[w] }}.svg" alt="">{% endif %}

      # {{ g }},<br>{{ user }}

      {% if w in words %}{{ words[w] }}{% if t is not none %} and {{ t | round(0) | int }}° outside{% endif %}.{% elif t is not none %}{{ t | round(0) | int }}° outside.{% endif %}
    card_mod:
      style:
        .: |
          ha-card { background: none; box-shadow: none; border: none; padding: 12px 0 0 0; position: relative; }
          ha-markdown { padding: 0 !important; }
        ha-markdown$: |
          h1 { font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; color: var(--primary-text-color); margin: 0 0 6px 0; padding-right: 72px; }
          p { font-size: 15px; color: var(--secondary-text-color); margin: 0; }
          ha-markdown-element h1 { font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; color: var(--primary-text-color); margin: 0 0 6px 0; padding-right: 72px; }
          ha-markdown-element p { font-size: 15px; color: var(--secondary-text-color); margin: 0; }
          img { position: absolute; right: 0; top: 6px; width: 96px; height: 96px; margin: 0; }

  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:decluttering-card
        template: person_tile
        variables:
          - person: person.person1
          - location: sensor.person1_location
          - name: Person 1
          - hash: '#person1'
      - type: custom:decluttering-card
        template: person_tile
        variables:
          - person: person.person2
          - location: sensor.person2_location
          - name: Person 2
          - hash: '#person2'

  #
  # Upcoming TV: the next Sonarr episode as one row (time · show · episode · SxxExx)
  #
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: sensor.sonarr_upcoming_media
    name: Upcoming TV Show
    icon: mdi:youtube-tv
    show_state: true
    scrolling_effect: true
    tap_action:
      action: more-info
    button_action:
      tap_action:
        action: navigate
        navigation_path: '#upcoming_tv'
    styles: |
      ${(() => {
        const d = hass.states['sensor.sonarr_upcoming_media']?.attributes?.data || [];
        const e = d[1];
        let text = 'No episodes coming up';
        if (e) {
          const when = e.airdate ? new Date(e.airdate).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
          text = [when, e.title, e.episode, e.number].filter(Boolean).join(' • ');
        }
        card.querySelector('.bubble-state').innerText = text;
        return '';
      })()}

  #
  # Needs attention: only present when something is wrong
  #
  - type: conditional
    conditions:
      - condition: or
        conditions:
          - condition: state
            entity: lock.master_bedroom_door
            state: unlocked
          - condition: state
            entity: lock.master_bedroom_door
            state: jammed
          - condition: state
            entity: lock.master_bedroom_door
            state: unavailable
          - condition: numeric_state
            entity: sensor.master_bedroom_door_battery
            below: 20
          - condition: state
            entity: climate.master_bedroom_aircon
            state: unavailable
          - condition: state
            entity: switch.xiaomi_iv02_f7b6_pet_drinking_fountain
            state: unavailable
    card:
      type: vertical-stack
      card_mod:
        style: |
          :host { --vertical-stack-card-gap: 8px; }
      cards:
        - type: custom:decluttering-card
          template: section_title
          variables:
            - title: Needs attention
        - type: conditional
          conditions:
            - condition: state
              entity: lock.master_bedroom_door
              state: unlocked
          card:
            type: custom:button-card
            template: app_attention_row
            entity: lock.master_bedroom_door
            name: Bedroom door
            icon: mdi:lock-open-variant
            variables:
              message: Unlocked. Tap to lock it.
            tap_action:
              action: perform-action
              perform_action: lock.lock
              target:
                entity_id: lock.master_bedroom_door
              haptic: medium
              confirmation:
                text: Lock the bedroom door?
        - type: conditional
          conditions:
            - condition: state
              entity: lock.master_bedroom_door
              state: jammed
          card:
            type: custom:button-card
            template: app_attention_row
            entity: lock.master_bedroom_door
            name: Bedroom door
            icon: mdi:lock-alert
            variables:
              message: Lock jammed. Check the door.
        - type: conditional
          conditions:
            - condition: state
              entity: lock.master_bedroom_door
              state: unavailable
          card:
            type: custom:button-card
            template: app_attention_row
            entity: lock.master_bedroom_door
            name: Door lock
            icon: mdi:lock-question
            variables:
              message: Offline. Check its Wi-Fi or battery.
        - type: conditional
          conditions:
            - condition: numeric_state
              entity: sensor.master_bedroom_door_battery
              below: 20
          card:
            type: custom:button-card
            template: app_attention_row
            entity: sensor.master_bedroom_door_battery
            name: Door lock battery
            icon: mdi:battery-alert
            variables:
              message: Low. Replace the batteries soon.
        - type: conditional
          conditions:
            - condition: state
              entity: climate.master_bedroom_aircon
              state: unavailable
          card:
            type: custom:button-card
            template: app_attention_row
            entity: climate.master_bedroom_aircon
            name: Aircon
            icon: mdi:air-conditioner
            variables:
              message: Controller offline. Check the Faikin on the unit.
        - type: conditional
          conditions:
            - condition: state
              entity: switch.xiaomi_iv02_f7b6_pet_drinking_fountain
              state: unavailable
          card:
            type: custom:button-card
            template: app_attention_row
            entity: switch.xiaomi_iv02_f7b6_pet_drinking_fountain
            name: Pet fountain
            icon: mdi:fountain
            variables:
              message: Offline. Check its power.

  #
  # Cats: last feed, next lunch, feed now, water
  #
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: script.feed_cat
    name: Cat1, Cat2, & Cat3
    icon: mdi:cat
    show_state: true
    tap_action:
      action: navigate
      navigation_path: /lovelace/pets
    sub_button:
      # Tap opens the script dialog (its Run button is the confirmation); hold feeds straight away.
      - name: Feed
        entity: script.feed_cat
        icon: mdi:bowl-mix
        show_name: false
        tap_action:
          action: more-info
        hold_action:
          action: perform-action
          perform_action: script.feed_cat
      - entity: switch.xiaomi_iv02_f7b6_pet_drinking_fountain
        icon: mdi:fountain
        tap_action:
          action: toggle
        hold_action:
          action: more-info
    app_style:
      color: var(--accent-color)
    styles: |
      ${(() => {
        const now = Date.now();
        const lt = hass.states['script.feed_cat']?.attributes?.last_triggered;
        let fed = 'Not fed yet';
        if (lt) {
          const diff = Math.floor((now - new Date(lt)) / 1000);
          fed = diff < 120 ? 'Fed just now'
            : 'Fed ' + (diff < 3600 ? Math.floor(diff / 60) + 'm' : (diff < 86400 ? Math.floor(diff / 3600) + 'h' : Math.floor(diff / 86400) + 'd')) + ' ago';
        }
        const sch = hass.states['automation.feed_cats'];
        let next = '';
        if (sch && sch.state === 'on') {
          const lunch = new Date(); lunch.setHours(12, 0, 0, 0);
          if (lunch.getTime() <= now) lunch.setDate(lunch.getDate() + 1);
          const mins = Math.round((lunch.getTime() - now) / 60000);
          next = mins <= 60 ? ' · Lunch in ' + mins + 'm' : (lunch.getDate() !== new Date().getDate() ? ' · Lunch tomorrow' : ' · Lunch at 12:00');
        } else if (sch) {
          next = ' · Schedule off';
        }
        card.querySelector('.bubble-state').innerText = fed + next;
        return '';
      })()}

  #
  # Climate: one Bubble row with sub-buttons (the air purifier's readings)
  #
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: sensor.zhimi_vb4_00ae_temperature
    name: Inside
    icon: mdi:home-thermometer
    show_state: true
    tap_action:
      action: more-info
    sub_button:
      - entity: sensor.zhimi_vb4_00ae_relative_humidity
        state_background: false
        icon: mdi:water-percent
        show_state: true
        tap_action:
          action: more-info
      - entity: sensor.zhimi_vb4_00ae_air_quality
        state_background: false
        icon: mdi:blur
        show_state: true
        tap_action:
          action: more-info

  #
  # Devices: Lights and Fans open their popups (defined at the bottom of this file)
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Devices
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: sensor.home_lights_on_count
    name: Lights
    icon: mdi:lightbulb-group
    show_state: true
    button_action:
      tap_action:
        action: navigate
        navigation_path: '#lights'
    tap_action:
      action: navigate
      navigation_path: '#lights'
    app_style:
      count_entity: sensor.home_lights_on_count
  - type: custom:bubble-card
    card_type: button
    button_type: name
    name: Fans
    icon: mdi:fan
    button_action:
      tap_action:
        action: navigate
        navigation_path: '#fans'
    tap_action:
      action: navigate
      navigation_path: '#fans'
  - type: conditional
    conditions:
      - condition: state
        entity: vacuum.hallway_robot_vacuum_vacuum
        state_not: unavailable
      - condition: state
        entity: vacuum.hallway_robot_vacuum_vacuum
        state_not: unknown
    card:
      type: custom:bubble-card
      card_type: button
      button_type: state
      entity: vacuum.hallway_robot_vacuum_vacuum
      name: Robot Vacuum
      icon: mdi:robot-vacuum
      show_state: true
      tap_action:
        action: more-info
      sub_button:
        - entity: vacuum.hallway_robot_vacuum_vacuum
          icon: mdi:play
          state_background: false
          tap_action:
            action: perform-action
            perform_action: vacuum.start
            target:
              entity_id: vacuum.hallway_robot_vacuum_vacuum
        - entity: vacuum.hallway_robot_vacuum_vacuum
          icon: mdi:home-import-outline
          state_background: false
          tap_action:
            action: perform-action
            perform_action: vacuum.return_to_base
            target:
              entity_id: vacuum.hallway_robot_vacuum_vacuum

  #
  # Routines
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Routines
  - type: tile
    entity: automation.feed_cats
    name: Scheduled Feeding
    icon: mdi:cat
    vertical: false
    state_content:
      - state
      - last_triggered
    tap_action:
      action: toggle
      confirmation:
        text: Turn scheduled feeding on or off? While it is on, both feeders dispense at 12:00 every day.
    icon_tap_action:
      action: more-info
  - type: grid
    columns: 1
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: automation.notify_feed_cat1_and_cat2
        name: Feeding Reminders
        secondary_info: last-changed
        fill_container: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: automation.notify_ohayou_gozaimasu
        name: Morning Greeting
        secondary_info: last-changed
        fill_container: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml

  #
  # Popups
  #
  - type: vertical-stack
    cards: !include /config/dashboards/mobile/shared/person_popups.yaml

  #
  # Lights popup: the room lights, same rows as the room pages
  #
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#lights'
    name: Lights
    icon: mdi:lightbulb-group
    show_header: true
    close_by_clicking_outside: true
    styles: !include /config/dashboards/templates/includes/app_popup_styles.yaml
    margin_top_mobile: max(0px, calc(100vh - 760px))
    margin_top_desktop: max(0px, calc(100vh - 760px))
    cards:
      - type: custom:decluttering-card
        template: section_title
        variables:
          - title: Master Bedroom
          - sub_button:
            - entity: switch.master_bedroom_adaptive_lighting
              icon: mdi:theme-light-dark
              show_name: false
              color_domain: light
              tap_action:
                action: toggle
              hold_action:
                action: more-info
      - type: custom:decluttering-card
        template: light_row
        variables:
          - entity: light.master_bedroom_all_lights
          - name: All lights
          - icon: mdi:lightbulb-group
          - count_entity: sensor.master_bedroom_lights_on_count
      - type: custom:decluttering-card
        template: light_row
        variables:
          - entity: light.master_bedroom_main_lights
          - name: Main Lights
          - icon: mdi:lightbulb-group
      - type: custom:decluttering-card
        template: light_row
        variables:
          - entity: light.master_bedroom_window_light
          - name: Window Light
      - type: custom:decluttering-card
        template: section_title
        variables:
          - title: Hobby Room
          - sub_button:
            - entity: switch.hobby_room_adaptive_lighting
              icon: mdi:theme-light-dark
              show_name: false
              color_domain: light
              tap_action:
                action: toggle
              hold_action:
                action: more-info
      - type: custom:decluttering-card
        template: light_row
        variables:
          - entity: light.hobby_room_all_lights
          - name: All lights
          - icon: mdi:lightbulb-group
          - count_entity: sensor.hobby_room_lights_on_count
      - type: custom:decluttering-card
        template: light_row
        variables:
          - entity: light.hobby_room_person1_table_lights
          - name: Person 1's Table
          - icon: mdi:lightbulb-group
      - type: custom:decluttering-card
        template: light_row
        variables:
          - entity: light.hobby_room_person2_table_lights
          - name: Person 2's Table
          - icon: mdi:lightbulb-group
      - type: custom:decluttering-card
        template: section_title
        variables:
          - title: Bedroom
          - sub_button:
            - entity: switch.bedroom_adaptive_lighting
              icon: mdi:theme-light-dark
              show_name: false
              color_domain: light
              tap_action:
                action: toggle
              hold_action:
                action: more-info
      - type: custom:decluttering-card
        template: light_row
        variables:
          - entity: light.bedroom_all_lights
          - name: All lights
          - icon: mdi:lightbulb-group
          - count_entity: sensor.bedroom_lights_on_count
      - type: custom:decluttering-card
        template: light_row
        variables:
          - entity: light.bedroom_main_lights
          - name: Main Lights
          - icon: mdi:lightbulb-group
      - type: custom:decluttering-card
        template: light_row
        variables:
          - entity: light.bedroom_cabinet_lights
          - name: Cabinet Lights
          - icon: mdi:lightbulb-group
      - type: custom:decluttering-card
        template: section_title
        variables:
          - title: Hallway
          - sub_button:
            - entity: switch.hallway_adaptive_lighting
              icon: mdi:theme-light-dark
              show_name: false
              color_domain: light
              tap_action:
                action: toggle
              hold_action:
                action: more-info
      - type: custom:decluttering-card
        template: light_row
        variables:
          - entity: light.hallway_all_lights
          - name: All lights
          - icon: mdi:lightbulb-group
          - count_entity: sensor.hallway_lights_on_count
      - type: custom:decluttering-card
        template: light_row
        variables:
          - entity: light.hallway_stairs_light
          - name: Stairs
      - type: custom:decluttering-card
        template: light_row
        variables:
          - entity: light.hallway_bedroom_light
          - name: Bedroom
      - type: custom:decluttering-card
        template: light_row
        variables:
          - entity: light.hallway_hobby_room_light
          - name: Hobby Room
      - type: custom:decluttering-card
        template: section_title
        variables:
          - title: Walk-in Closet
          - sub_button:
            - entity: switch.walk_in_closet_adaptive_lighting
              icon: mdi:theme-light-dark
              show_name: false
              color_domain: light
              tap_action:
                action: toggle
              hold_action:
                action: more-info
      - type: custom:decluttering-card
        template: light_row
        variables:
          - entity: light.walk_in_closet_all_lights
          - name: All lights
          - icon: mdi:lightbulb-group
          - count_entity: sensor.walk_in_closet_lights_on_count
      - type: custom:decluttering-card
        template: light_row
        variables:
          - entity: light.walk_in_closet_left_light
          - name: Left Light
      - type: custom:decluttering-card
        template: light_row
        variables:
          - entity: light.walk_in_closet_right_light
          - name: Right Light
      - type: custom:decluttering-card
        template: section_title
        variables:
          - title: Master Bathroom
          - sub_button:
            - entity: switch.master_bathroom_adaptive_lighting
              icon: mdi:theme-light-dark
              show_name: false
              color_domain: light
              tap_action:
                action: toggle
              hold_action:
                action: more-info
      - type: custom:decluttering-card
        template: light_row
        variables:
          - entity: light.master_bathroom_all_lights
          - name: All lights
          - icon: mdi:lightbulb-group
          - count_entity: sensor.master_bathroom_lights_on_count
      - type: custom:decluttering-card
        template: light_row
        variables:
          - entity: light.master_bathroom_shower_light
          - name: Shower Light
      - type: custom:decluttering-card
        template: light_row
        variables:
          - entity: light.master_bathroom_door_light
          - name: Door Light
  #
  # Fans popup: the two standing fans
  #
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#fans'
    name: Fans
    icon: mdi:fan
    show_header: true
    close_by_clicking_outside: true
    styles: !include /config/dashboards/templates/includes/app_popup_styles.yaml
    margin_top_mobile: max(0px, calc(100vh - 760px))
    margin_top_desktop: max(0px, calc(100vh - 760px))
    cards:
      - type: custom:mushroom-fan-card
        entity: fan.dmaker_p33_c4d3_fan
        name:
          type: area
        icon_animation: true
        show_percentage_control: true
        collapsible_controls: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        features:
          - type: fan-preset-modes
            style: dropdown
      - type: custom:mushroom-fan-card
        entity: fan.dmaker_p15_03db_fan
        name:
          type: area
        icon_animation: true
        show_percentage_control: true
        collapsible_controls: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        features:
          - type: fan-preset-modes
            style: dropdown
