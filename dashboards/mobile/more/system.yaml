type: custom:vertical-layout
title: System
path: system
theme: Catppuccin Auto Latte Mocha Dashboard
subview: true
layout: !include /config/dashboards/templates/includes/layouts/app_page_layout.yaml
cards:
  #
  # Chips
  #
  - type: custom:mushroom-chips-card
    card_mod: !include /config/dashboards/templates/includes/card_mod/chips/app_chip_scroll_row.yaml
    chips:
      - type: template
        entity: binary_sensor.zigbee2mqtt_bridge_connection_state
        icon: mdi:zigbee
        icon_color: "{{ 'green' if is_state('binary_sensor.zigbee2mqtt_bridge_connection_state','on') else 'red' }}"
        content: "{{ 'Zigbee OK' if is_state('binary_sensor.zigbee2mqtt_bridge_connection_state','on') else 'Zigbee down' }}"
        tap_action:
          action: more-info
      - type: template
        entity: binary_sensor.adguard_home_running
        icon: mdi:shield-check
        icon_color: "{{ 'green' if is_state('binary_sensor.adguard_home_running','on') else 'red' }}"
        content: "{{ 'AdGuard OK' if is_state('binary_sensor.adguard_home_running','on') else 'AdGuard down' }}"
        tap_action:
          action: more-info
      - type: template
        entity: sensor.speedtest_download
        icon: mdi:wifi
        icon_color: purple
        content: "{{ states('sensor.speedtest_download') | float(0) | round(0) | int }} Mbps"
        tap_action:
          action: more-info

  #
  # Server
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Server
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: sensor.system_monitor_processor_use
        name: CPU
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.system_monitor_processor_temperature
        name: CPU Temperature
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.system_monitor_memory_usage
        name: Memory
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.system_monitor_disk_free
        name: Free Storage
        fill_container: true
        tap_action:
          action: more-info

  #
  # Network
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Network
  - type: grid
    columns: 3
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: sensor.speedtest_download
        name: Download
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.speedtest_upload
        name: Upload
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.speedtest_ping
        name: Ping
        fill_container: true
        tap_action:
          action: more-info

  #
  # Infrastructure
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Infrastructure
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: binary_sensor.zigbee2mqtt_bridge_connection_state
        name: Zigbee2MQTT
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.slzb_06m_zigbee_chip_temp
        name: SLZB-06M Zigbee Chip
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: binary_sensor.adguard_home_running
        name: AdGuard Home
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.backup_last_successful_automatic_backup
        name: Last Backup
        fill_container: true
        tap_action:
          action: more-info

  #
  #
  # Automations
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Automations
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: automation.auto_theme_switch
        name: Auto Light/Dark Theme
        secondary_info: last-changed
        fill_container: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: automation.notify_check_and_lock_doors_and_windows
        name: Lock-up Reminder
        secondary_info: last-changed
        fill_container: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info

  #
  # Batteries
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Batteries
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: sensor.person1_phone_battery_level
        name: Person 1's Phone
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.person2_phone_battery_level
        name: Person 2's Phone
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.xiaomi_iv02_f7b6_battery_level
        name: Pet Fountain
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.ijai_v3_aaa0_battery_level
        name: Robot Vacuum
        fill_container: true
        tap_action:
          action: more-info

  #
  # Maintenance
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Maintenance
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: sensor.zhimi_vb4_00ae_filter_left_time
        name: Air Purifier Filter
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.xiaomi_iv02_f7b6_filter_left_time
        name: Fountain Filter
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.ijai_v3_aaa0_main_brush_life
        name: Vacuum Main Brush
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.ijai_v3_aaa0_side_brush_life
        name: Vacuum Side Brush
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.ijai_v3_aaa0_hypa_life
        name: Vacuum HEPA
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.ijai_v3_aaa0_mop_life
        name: Vacuum Mop Pad
        fill_container: true
        tap_action:
          action: more-info

  #
  # Electricity
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Electricity
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: sensor.meralco_electricity_rates_rate
        name: Meralco Rate
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.meralco_electricity_rates_rate_change
        name: Rate Change
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.meralco_generation_charge
        name: Generation Charge
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.master_bedroom_aircon_lifetime_outside_energy
        name: Aircon Lifetime Energy
        fill_container: true
        tap_action:
          action: more-info

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml
