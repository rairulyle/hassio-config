type: custom:vertical-layout
title: System
path: system
theme: Catppuccin Auto Latte Mocha Dashboard
subview: true
layout: !include /config/dashboards/templates/includes/layouts/app_page_layout.yaml
cards:
  #
  # Chips
  #
  - type: custom:mushroom-chips-card
    card_mod: !include /config/dashboards/templates/includes/card_mod/chips/app_chip_scroll_row.yaml
    chips:
      - type: template
        entity: binary_sensor.slzb_mr4u_ethernet
        icon: mdi:zigbee
        icon_color: "{{ 'green' if is_state('binary_sensor.slzb_mr4u_ethernet','on') else 'red' }}"
        content: "{{ 'Zigbee OK' if is_state('binary_sensor.slzb_mr4u_ethernet','on') else 'Zigbee down' }}"
        tap_action:
          action: more-info
      - type: template
        entity: binary_sensor.adguard_home_running
        icon: mdi:shield-check
        icon_color: "{{ 'green' if is_state('binary_sensor.adguard_home_running','on') else 'red' }}"
        content: "{{ 'AdGuard OK' if is_state('binary_sensor.adguard_home_running','on') else 'AdGuard down' }}"
        tap_action:
          action: more-info

  #
  # Server
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Server
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: sensor.system_monitor_processor_use
        name: CPU
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.system_monitor_processor_temperature
        name: CPU Temp
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.system_monitor_memory_usage
        name: Memory
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.system_monitor_disk_free
        name: Free Storage
        fill_container: true
        tap_action:
          action: more-info

  #
  # Infrastructure
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Infrastructure
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: binary_sensor.slzb_mr4u_ethernet
        name: Zigbee Coordinator
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.slzb_mr4u_zigbee_chip_temp
        name: Zigbee Chip
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: binary_sensor.adguard_home_running
        name: AdGuard
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.backup_last_successful_automatic_backup
        name: Last Backup
        fill_container: true
        tap_action:
          action: more-info

  #
  #
  # Automations
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Automations
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: automation.system_set_the_theme_on_startup
        name: Auto Theme
        secondary_info: last-changed
        fill_container: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info

  #
  # Batteries: every battery sensor that reports a percentage, lowest first, named area + device.
  # Phones and watches (mobile_app), Xiaomi appliances (xiaomi_miot: fountains, vacuum), Browser Mod
  # browsers and restored ghosts of removed devices are skipped: locks, the gate, climate sensors stay.
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Batteries
  - type: custom:auto-entities
    card:
      type: grid
      columns: 2
      square: false
    card_param: cards
    sort:
      method: state
      numeric: true
    filter:
      template: >-
        {% set ns = namespace(cards=[]) %}
        {% for s in states.sensor
             | selectattr('attributes.device_class', 'eq', 'battery')
             | selectattr('attributes.unit_of_measurement', 'eq', '%')
             | rejectattr('entity_id', 'in', integration_entities('mobile_app'))
             | rejectattr('entity_id', 'in', integration_entities('browser_mod'))
             | rejectattr('entity_id', 'in', integration_entities('xiaomi_miot'))
             | rejectattr('attributes.restored', 'defined') %}
          {% set name = s.name | regex_replace('(?i)\s*battery( level)?$', '') %}
          {% set area = area_name(s.entity_id) %}
          {% set name = area ~ ' ' ~ name if area and area not in name else name %}
          {% set ns.cards = ns.cards + [{
            'type': 'custom:mushroom-entity-card',
            'entity': s.entity_id,
            'name': name,
            'fill_container': true,
            'tap_action': {'action': 'more-info'},
          }] %}
        {% endfor %}
        {{ ns.cards }}

  #
  # Maintenance
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Maintenance
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: sensor.zhimi_vb4_00ae_filter_left_time
        name: Purifier
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.xiaomi_iv02_f7b6_filter_left_time
        name: Fountain
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.ijai_v3_aaa0_main_brush_life
        name: Main Brush
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.ijai_v3_aaa0_side_brush_life
        name: Side Brush
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.ijai_v3_aaa0_hypa_life
        name: HEPA Filter
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.ijai_v3_aaa0_mop_life
        name: Mop Pad
        fill_container: true
        tap_action:
          action: more-info

  #
  # Electricity
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Electricity
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: sensor.meralco_electricity_rates_rate
        name: Meralco Rate
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.meralco_electricity_rates_rate_change
        name: Rate Change
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.meralco_generation_charge
        name: Generation
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.master_bedroom_aircon_lifetime_outside_energy
        name: Aircon Energy
        fill_container: true
        tap_action:
          action: more-info

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml
