type: custom:vertical-layout
title: System
path: system
theme: Catppuccin Mocha Dashboard
subview: true
layout: !include /config/dashboards/templates/includes/layouts/app_page_layout.yaml
cards:
  - type: custom:decluttering-card
    template: top_toolbar
    variables:
      - cards:
        - type: custom:button-card
          template: app_header_chip_card
          icon: mdi:arrow-left
          tap_action:
            action: navigate
            navigation_path: /lovelace/home
            haptic: light
        - type: custom:button-card
          template: app_header_page_title
          name: System
        - type: custom:button-card
          template: empty_column

  #
  # Chips
  #
  - type: custom:mod-card
    style: !include /config/dashboards/templates/includes/card_mod/chips/page_chip_layout.yaml
    card:
      type: horizontal-stack
      cards:
        - type: custom:button-card
          template: app_chip_card
          entity: binary_sensor.zigbee2mqtt_bridge_connection_state
          icon: mdi:zigbee
          state_display: "[[[ return entity.state == 'on' ? 'Zigbee OK' : 'Zigbee down'; ]]]"
          state:
            - value: "on"
              color: var(--success-color)
            - operator: default
              color: var(--error-color)
        - type: custom:button-card
          template: app_chip_card
          entity: binary_sensor.adguard_home_running
          icon: mdi:shield-check
          state_display: "[[[ return entity.state == 'on' ? 'AdGuard OK' : 'AdGuard down'; ]]]"
          state:
            - value: "on"
              color: var(--success-color)
            - operator: default
              color: var(--error-color)
        - type: custom:button-card
          template: app_chip_card
          entity: sensor.speedtest_download
          icon: app:app-wifi
          color: var(--primary-color)
          state_display: "[[[ return Math.round(parseFloat(entity.state)) + ' Mbps'; ]]]"

  #
  # Server
  #
  - type: custom:button-card
    template: section_title
    name: Server
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        entity: sensor.system_monitor_processor_use
        name: CPU
        template: app_value_entity
        icon: mdi:cpu-64-bit
      - type: custom:button-card
        entity: sensor.system_monitor_processor_temperature
        name: CPU Temperature
        template: app_value_entity
        icon: mdi:thermometer
      - type: custom:button-card
        entity: sensor.system_monitor_memory_usage
        name: Memory
        template: app_value_entity
        icon: mdi:memory
      - type: custom:button-card
        entity: sensor.system_monitor_disk_free
        name: Free Storage
        template: app_value_entity
        icon: mdi:harddisk

  - type: custom:mini-graph-card
    name: CPU & Memory
    icon: mdi:chart-line
    hours_to_show: 24
    points_per_hour: 4
    line_width: 2
    smoothing: true
    lower_bound: 0
    upper_bound: 100
    show:
      legend: true
    entities:
      - entity: sensor.system_monitor_processor_use
        name: CPU
        color: "#89b4fa"
      - entity: sensor.system_monitor_memory_usage
        name: RAM
        color: "#f9e2af"
    card_mod: !include /config/dashboards/templates/includes/card_mod/climate_card/app_climate_card_graph_styles.yaml

  #
  # Network
  #
  - type: custom:button-card
    template: section_title
    name: Network
  - type: entities
    card_mod: !include /config/dashboards/templates/includes/card_mod/base/app_vertical_stack.yaml
    entities:
      - entity: sensor.speedtest_download
        name: Download
        icon: mdi:download-network
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: sensor.speedtest_upload
        name: Upload
        icon: mdi:upload-network
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: sensor.speedtest_ping
        name: Ping
        icon: mdi:timer-outline
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: switch.cloud_remote
        name: Remote Access
        icon: mdi:cloud-outline
        state_color: true
        secondary_info: last-changed
        card_mod: !include /config/dashboards/templates/includes/app_boolean_entity_layout.yaml

  #
  # Infrastructure
  #
  - type: custom:button-card
    template: section_title
    name: Infrastructure
  - type: entities
    card_mod: !include /config/dashboards/templates/includes/card_mod/base/app_vertical_stack.yaml
    entities:
      - entity: binary_sensor.zigbee2mqtt_bridge_connection_state
        name: Zigbee2MQTT
        icon: mdi:zigbee
        state_color: true
        secondary_info: last-changed
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: sensor.slzb_06m_zigbee_chip_temp
        name: SLZB-06M Zigbee Chip
        icon: mdi:access-point
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: binary_sensor.adguard_home_running
        name: AdGuard Home
        icon: mdi:shield-check
        state_color: true
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: sensor.backup_last_successful_automatic_backup
        name: Last Backup
        icon: mdi:backup-restore
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml

  #
  # Batteries
  #
  - type: custom:button-card
    template: section_title
    name: Batteries
  - type: entities
    card_mod: !include /config/dashboards/templates/includes/card_mod/base/app_vertical_stack.yaml
    entities:
      - entity: sensor.person1_phone_battery_level
        name: Person 1's Phone
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: sensor.person2_phone_battery_level
        name: Person 2's Phone
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: sensor.xiaomi_iv02_f7b6_battery_level
        name: Pet Fountain 2
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: sensor.ijai_v3_aaa0_battery_level
        name: Robot Vacuum
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml

  #
  # Maintenance
  #
  - type: custom:button-card
    template: section_title
    name: Maintenance
  - type: entities
    card_mod: !include /config/dashboards/templates/includes/card_mod/base/app_vertical_stack.yaml
    entities:
      - entity: sensor.zhimi_vb4_00ae_filter_left_time
        name: Air Purifier Filter
        icon: mdi:air-filter
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: sensor.xiaomi_iv02_f7b6_filter_left_time
        name: Fountain 2 Filter
        icon: mdi:air-filter
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: sensor.mmgg_wi11_9352_filter_left_time
        name: Fountain 1 Filter
        icon: mdi:air-filter
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: sensor.ijai_v3_aaa0_main_brush_life
        name: Vacuum Main Brush
        icon: mdi:broom
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: sensor.ijai_v3_aaa0_side_brush_life
        name: Vacuum Side Brush
        icon: mdi:broom
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: sensor.ijai_v3_aaa0_hypa_life
        name: Vacuum HEPA
        icon: mdi:air-filter
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: sensor.ijai_v3_aaa0_mop_life
        name: Vacuum Mop Pad
        icon: mdi:water-outline
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml

  #
  # Electricity
  #
  - type: custom:button-card
    template: section_title
    name: Electricity
  - type: entities
    card_mod: !include /config/dashboards/templates/includes/card_mod/base/app_vertical_stack.yaml
    entities:
      - entity: sensor.meralco_electricity_rates_rate
        name: Meralco Rate
        icon: mdi:meter-electric
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: sensor.meralco_electricity_rates_rate_change
        name: Rate Change
        icon: mdi:swap-vertical
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: sensor.meralco_generation_charge
        name: Generation Charge
        icon: mdi:transmission-tower
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: sensor.masterbedroom_aircon_lifetime_outside_energy
        name: Aircon Lifetime Energy
        icon: mdi:lightning-bolt
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml
