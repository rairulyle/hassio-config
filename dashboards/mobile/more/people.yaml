type: custom:vertical-layout
title: People
path: people
theme: Catppuccin Auto Latte Mocha Dashboard
subview: true
layout: !include /config/dashboards/templates/includes/layouts/app_page_layout.yaml
cards:
  #
  # Chips
  #
  - type: custom:mushroom-chips-card
    card_mod: !include /config/dashboards/templates/includes/card_mod/chips/app_chip_scroll_row.yaml
    chips:
      - type: template
        entity: person.person1
        icon: mdi:home-account
        icon_color: "{{ 'green' if (['person.person1','person.person2'] | map('states') | select('eq','home') | list | count) > 0 else 'grey' }}"
        content: "{% set n = ['person.person1','person.person2'] | map('states') | select('eq','home') | list | count %}{{ 'Nobody home' if n == 0 else ('1 person home' if n == 1 else n ~ ' people home') }}"
        tap_action:
          action: more-info

  #
  # People
  #
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-person-card
        entity: person.person1
        use_entity_picture: true
        name: Person 1
        fill_container: true
        tap_action:
          action: navigate
          navigation_path: '#person1'
      - type: custom:mushroom-person-card
        entity: person.person2
        use_entity_picture: true
        name: Person 2
        fill_container: true
        tap_action:
          action: navigate
          navigation_path: '#person2'

  #
  # Map
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Map
  - type: map
    entities:
      - device_tracker.person1_phone
      - device_tracker.person2_phone
    hours_to_show: 24
    auto_fit: true
    theme_mode: dark

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml

  #
  # Popups
  #
  - type: vertical-stack
    cards: !include /config/dashboards/mobile/shared/person_popups.yaml
