type: custom:vertical-layout
title: People
path: people
theme: Catppuccin Auto Latte Mocha Dashboard
subview: true
layout: !include /config/dashboards/templates/includes/layouts/app_page_layout.yaml
cards:
  #
  # Chips
  #
  - type: custom:mushroom-chips-card
    card_mod: !include /config/dashboards/templates/includes/card_mod/chips/app_chip_scroll_row.yaml
    chips:
      - type: template
        entity: person.person1
        icon: mdi:home-account
        icon_color: "{% from 'state_color.jinja' import state_color %}{{ state_color('person.home', 'home' if (['person.person1','person.person2'] | map('states') | select('eq','home') | list | count) > 0 else 'not_home') }}"
        content: "{% set n = ['person.person1','person.person2'] | map('states') | select('eq','home') | list | count %}{{ 'Nobody home' if n == 0 else ('1 person home' if n == 1 else n ~ ' people home') }}"
        tap_action:
          action: more-info

  #
  # People
  #
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:decluttering-card
        template: person_tile
        variables:
          - person: person.person1
          - location: sensor.person1_location
          - name: Person 1
          - hash: '#person1'
      - type: custom:decluttering-card
        template: person_tile
        variables:
          - person: person.person2
          - location: sensor.person2_location
          - name: Person 2
          - hash: '#person2'

  #
  # Map
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Map
  - type: map
    entities:
      - device_tracker.person1_galaxy_z_fold8_ultra_person1_z_fold8_ultra
      - device_tracker.person2_galaxy_z_fold8_person2_z_fold8
    hours_to_show: 24
    auto_fit: true
    theme_mode: dark

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml

  #
  # Popups
  #
  - type: vertical-stack
    cards: !include /config/dashboards/mobile/shared/person_popups.yaml
