type: custom:vertical-layout
title: Bedroom
path: rooms-bedroom
theme: Catppuccin Auto Latte Mocha Dashboard
subview: true
layout: !include /config/dashboards/templates/includes/layouts/app_page_layout.yaml
cards:
  #
  # Chips
  #
  - type: custom:mushroom-chips-card
    card_mod: !include /config/dashboards/templates/includes/card_mod/chips/app_chip_scroll_row.yaml
    chips:
      - type: template
        entity: climate.bedroom_aircon
        icon: "{% from 'aircon.jinja' import aircon_icon %}{{ aircon_icon('climate.bedroom_aircon') }}"
        icon_color: "{% from 'state_color.jinja' import state_color %}{{ state_color('climate.bedroom_aircon') }}"
        content: "{% from 'aircon.jinja' import aircon_label %}{{ aircon_label('climate.bedroom_aircon') }}"
        tap_action:
          action: more-info
      - type: template
        entity: sensor.bedroom_climate_sensor_temperature
        icon: mdi:thermometer-water
        content: "{{ states('sensor.bedroom_climate_sensor_temperature') | float(0) | round(1) }}° · {{ states('sensor.bedroom_climate_sensor_humidity') | float(0) | round(0) | int }}%"
        tap_action:
          action: more-info
      - type: template
        entity: switch.bedroom_adaptive_lighting
        icon: "{{ 'mdi:weather-night' if is_state('switch.bedroom_adaptive_lighting_sleep_mode','on') else 'mdi:theme-light-dark' }}"
        icon_color: "{% from 'state_color.jinja' import state_color %}{{ state_color('light', states('switch.bedroom_adaptive_lighting')) }}"
        content: "{{ 'Manual' if not is_state('switch.bedroom_adaptive_lighting','on') else ('Sleep' if is_state('switch.bedroom_adaptive_lighting_sleep_mode','on') else 'Adaptive') }}"
        tap_action:
          action: toggle
        double_tap_action:
          action: perform-action
          perform_action: switch.toggle
          target:
            entity_id: switch.bedroom_adaptive_lighting_sleep_mode
        hold_action:
          action: more-info
      - type: action
        icon: mdi:dots-horizontal
        icon_color: grey
        tap_action:
          action: navigate
          navigation_path: '#bedroom_settings'

  #
  # Aircon
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Aircon
  - type: custom:decluttering-card
    template: aircon_card
    variables:
      - entity: climate.bedroom_aircon

  #
  # Lights
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Lights
  - type: custom:decluttering-card
    template: light_row
    variables:
      - entity: light.bedroom_all_lights
      - name: All lights
      - icon: mdi:lightbulb-group
      - count_entity: sensor.bedroom_lights_on_count
  - type: custom:decluttering-card
    template: light_row
    variables:
      - entity: light.bedroom_main_lights
      - name: Main Lights
      - icon: mdi:lightbulb-group
  - type: custom:decluttering-card
    template: light_row
    variables:
      - entity: light.bedroom_cabinet_lights
      - name: Cabinet Lights
      - icon: mdi:lightbulb-group
  - type: grid
    columns: 2
    square: false
    cards:
      - type: tile
        entity: light.bedroom_door_light
        name: Door
        icon: mdi:light-recessed
        vertical: true
        hide_state: true
      - type: tile
        entity: light.bedroom_window_light
        name: Window
        icon: mdi:light-recessed
        vertical: true
        hide_state: true
      - type: tile
        entity: light.bedroom_cabinet_left_light
        name: Cabinet Left
        icon: mdi:light-recessed
        vertical: true
        hide_state: true
      - type: tile
        entity: light.bedroom_cabinet_right_light
        name: Cabinet Right
        icon: mdi:light-recessed
        vertical: true
        hide_state: true

  #
  # Sockets
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Sockets
  - type: custom:decluttering-card
    template: socket_tile
    variables:
      - entity: switch.bedroom_bed_side_socket
      - power: sensor.bedroom_bed_side_socket_power
      - name: Bed-side

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml

  #
  # Settings popup
  #
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#bedroom_settings'
    name: Bedroom Settings
    icon: app:app-bed-single
    show_header: true
    close_by_clicking_outside: true
    styles: !include /config/dashboards/templates/includes/app_popup_styles.yaml
    margin_top_mobile: max(0px, calc(100vh - 760px))
    margin_top_desktop: max(0px, calc(100vh - 760px))
    cards:
      - type: custom:decluttering-card
        template: section_title
        variables:
          - title: Aircon
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: select.bedroom_aircon_demand_control
            name: Demand Control
            fill_container: true
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.bedroom_aircon_lifetime_outside_energy
            name: Lifetime Energy
            fill_container: true
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: button.bedroom_aircon_restart
            name: Restart Controller
            fill_container: true
            tap_action:
              action: more-info
      - type: custom:decluttering-card
        template: section_title
        variables:
          - title: Wall Switch
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: switch.bedroom_wall_switch_l1
            name: Relay 1
            secondary_info: last-changed
            fill_container: true
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: switch.bedroom_wall_switch_l2
            name: Relay 2
            secondary_info: last-changed
            fill_container: true
            tap_action:
              action: more-info
      - type: custom:decluttering-card
        template: section_title
        variables:
          - title: Sockets
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: sensor.bedroom_bed_side_socket_energy
            name: Bed-side Energy
            fill_container: true
            tap_action:
              action: more-info
