type: custom:vertical-layout
title: Bedroom
path: rooms-bedroom
theme: Catppuccin Auto Latte Mocha Dashboard
subview: true
layout: !include /config/dashboards/templates/includes/layouts/app_page_layout.yaml
cards:
  #
  # Chips
  #
  - type: custom:mushroom-chips-card
    card_mod: !include /config/dashboards/templates/includes/card_mod/chips/app_chip_scroll_row.yaml
    chips:
      - type: template
        entity: light.bedroom_all_lights
        icon: mdi:lightbulb-group
        icon_color: "{{ 'amber' if (expand(['light.bedroom_door_light', 'light.bedroom_window_light', 'light.bedroom_cabinet_left_light', 'light.bedroom_cabinet_right_light']) | selectattr('state','eq','on') | list | count) > 0 else 'grey' }}"
        content: "{% set n = expand(['light.bedroom_door_light', 'light.bedroom_window_light', 'light.bedroom_cabinet_left_light', 'light.bedroom_cabinet_right_light']) | selectattr('state','eq','on') | list | count %}{{ (n ~ ' On') if n > 0 else 'Off' }}"
        tap_action:
          action: more-info
      - type: entity
        entity: fan.dmaker_p15_03db_fan
        content_info: state
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - type: action
        icon: mdi:dots-horizontal
        icon_color: grey
        tap_action:
          action: navigate
          navigation_path: '#bedroom_settings'

  #
  # Lights
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Lights
  - type: tile
    entity: light.bedroom_main_lights
    name: Main Lights
    icon: mdi:lightbulb-group
    show_entity_picture: false
    hide_state: false
    features:
      - type: light-brightness
    features_position: inline
    vertical: false
  - type: tile
    entity: light.bedroom_cabinet_lights
    name: Cabinet Lights
    icon: mdi:lightbulb-group
    show_entity_picture: false
    hide_state: false
    features:
      - type: light-brightness
    features_position: inline
    vertical: false
  - type: grid
    columns: 4
    square: false
    cards:
      - type: tile
        entity: light.bedroom_door_light
        name: Door
        icon: mdi:light-recessed
        vertical: true
        hide_state: true
      - type: tile
        entity: light.bedroom_window_light
        name: Window
        icon: mdi:light-recessed
        vertical: true
        hide_state: true
      - type: tile
        entity: light.bedroom_cabinet_left_light
        name: Cab. L
        icon: mdi:light-recessed
        vertical: true
        hide_state: true
      - type: tile
        entity: light.bedroom_cabinet_right_light
        name: Cab. R
        icon: mdi:light-recessed
        vertical: true
        hide_state: true

  #
  # Fan
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Fan
  - type: custom:mushroom-fan-card
    entity: fan.dmaker_p15_03db_fan
    name: Standing Fan
    icon_animation: true
    show_percentage_control: true
    collapsible_controls: true
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    features:
      - type: fan-preset-modes
        style: dropdown

  #
  # Media: only while the TV is reachable
  #
  - type: conditional
    conditions:
      - condition: state
        entity: media_player.bedroom_tv
        state_not: unavailable
    card:
      type: vertical-stack
      cards:
        - type: custom:decluttering-card
          template: section_title
          variables:
            - title: Media
        - type: custom:mushroom-media-player-card
          entity: media_player.bedroom_tv
          name: Bedroom TV
          use_media_info: true
          collapsible_controls: true
          media_controls:
            - play_pause_stop
            - previous
            - next
          volume_controls:
            - volume_mute
            - volume_set

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml

  #
  # Settings popup
  #
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#bedroom_settings'
    name: Bedroom Settings
    icon: mdi:bed-single
    show_header: true
    close_by_clicking_outside: true
    styles: !include /config/dashboards/templates/includes/app_popup_styles.yaml
    margin_top_mobile: max(0px, calc(100vh - 760px))
    margin_top_desktop: max(0px, calc(100vh - 760px))
    cards:
      - type: custom:decluttering-card
        template: section_title
        variables:
          - title: Standing Fan
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: switch.dmaker_p15_03db_physical_control_locked
            name: Child Lock
            secondary_info: last-changed
            fill_container: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: switch.dmaker_p15_03db_alarm
            name: Beep
            secondary_info: last-changed
            fill_container: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: light.dmaker_p15_03db_indicator_light
            name: Indicator Light
            secondary_info: last-changed
            fill_container: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
