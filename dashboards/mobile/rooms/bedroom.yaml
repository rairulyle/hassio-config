type: custom:vertical-layout
title: Bedroom
path: rooms-bedroom
theme: Catppuccin Mocha Dashboard
subview: true
layout: !include /config/dashboards/templates/includes/layouts/app_page_layout.yaml
cards:
  - type: custom:decluttering-card
    template: room_page_top_toolbar
    variables:
      - name: Bedroom
      - navigation_path: /lovelace/rooms
      - settings_path: '#bedroom_settings'

  #
  # Chips
  #
  - type: custom:mod-card
    style: !include /config/dashboards/templates/includes/card_mod/chips/page_chip_layout.yaml
    card:
      type: horizontal-stack
      cards:
        - type: custom:button-card
          template: app_lights_chip
          entity: light.bedroom_all_lights
          variables:
            lights:
              - light.bedroom_door_light
              - light.bedroom_window_light
              - light.bedroom_cabinet_left_light
              - light.bedroom_cabinet_right_light
        - type: custom:button-card
          template: app_device_chip
          entity: fan.dmaker_p15_03db_fan
          icon: mdi:fan

  #
  # Lights
  #
  - type: custom:button-card
    template: section_title
    name: Lights
  - type: tile
    entity: light.bedroom_main_lights
    name: Main Lights
    icon: mdi:ceiling-light-multiple
    show_entity_picture: false
    hide_state: false
    features:
      - type: light-brightness
    features_position: inline
    vertical: false
  - type: tile
    entity: light.bedroom_cabinet_lights
    name: Cabinet Lights
    icon: mdi:wardrobe-outline
    show_entity_picture: false
    hide_state: false
    features:
      - type: light-brightness
    features_position: inline
    vertical: false
  - type: grid
    columns: 4
    square: false
    cards:
      - type: tile
        entity: light.bedroom_door_light
        name: Door
        icon: mdi:lightbulb
        vertical: true
        hide_state: true
      - type: tile
        entity: light.bedroom_window_light
        name: Window
        icon: mdi:lightbulb
        vertical: true
        hide_state: true
      - type: tile
        entity: light.bedroom_cabinet_left_light
        name: Cab. L
        icon: mdi:lightbulb
        vertical: true
        hide_state: true
      - type: tile
        entity: light.bedroom_cabinet_right_light
        name: Cab. R
        icon: mdi:lightbulb
        vertical: true
        hide_state: true

  #
  # Fan
  #
  - type: custom:button-card
    template: section_title
    name: Fan
  - type: tile
    entity: fan.dmaker_p15_03db_fan
    name: Standing Fan
    icon: mdi:fan
    features_position: inline
    vertical: false
    features:
      - type: fan-speed
  - type: entities
    card_mod: !include /config/dashboards/templates/includes/card_mod/base/app_vertical_stack.yaml
    entities:
      - entity: switch.dmaker_p15_03db_horizontal_swing
        name: Oscillation
        icon: mdi:arrow-left-right
        card_mod: !include /config/dashboards/templates/includes/app_boolean_entity_layout.yaml
        secondary_info: last-changed
        state_color: true
      - entity: select.dmaker_p15_03db_horizontal_angle
        name: Swing Angle
        icon: mdi:angle-acute
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml

  #
  # Devices
  #
  - type: custom:button-card
    template: section_title
    name: Devices
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        entity: fan.dmaker_p15_03db_fan
        name: Standing Fan
        template: app_fan_entity
        tap_action:
          action: toggle
          haptic: light
        hold_action:
          action: more-info
      - type: custom:button-card
        entity: media_player.bedroom_tv
        name: Bedroom TV
        template: app_device_entity
        icon: app:app-device-tv

  - type: conditional
    conditions:
      - condition: state
        entity: media_player.bedroom_tv
        state_not: unavailable
    card:
      type: media-control
      entity: media_player.bedroom_tv

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml

  #
  # Settings popup
  #
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#bedroom_settings'
    close_by_clicking_outside: true
    styles: !include /config/dashboards/templates/includes/app_popup_styles.yaml
    margin_top_mobile: calc(100vh - 760px)
    margin_top_desktop: calc(100vh - 760px)
    cards:
      - type: custom:button-card
        template: app_popup_page_title
        name: Bedroom Settings
      - type: custom:button-card
        template: section_title
        name: Standing Fan
      - type: entities
        card_mod: !include /config/dashboards/templates/includes/card_mod/base/app_vertical_stack.yaml
        entities:
          - entity: switch.dmaker_p15_03db_physical_control_locked
            name: Child Lock
            icon: mdi:lock-outline
            card_mod: !include /config/dashboards/templates/includes/app_boolean_entity_layout.yaml
            state_color: true
          - entity: switch.dmaker_p15_03db_alarm
            name: Beep
            icon: mdi:volume-high
            card_mod: !include /config/dashboards/templates/includes/app_boolean_entity_layout.yaml
            state_color: true
          - entity: light.dmaker_p15_03db_indicator_light
            name: Indicator Light
            icon: mdi:led-outline
            card_mod: !include /config/dashboards/templates/includes/app_boolean_entity_layout.yaml
            state_color: true
