type: custom:vertical-layout
title: Living Room
path: rooms-living-room
theme: Catppuccin Auto Latte Mocha Dashboard
subview: true
layout: !include /config/dashboards/templates/includes/layouts/app_page_layout.yaml
cards:
  #
  # Chips
  #
  - type: custom:mushroom-chips-card
    card_mod: !include /config/dashboards/templates/includes/card_mod/chips/app_chip_scroll_row.yaml
    chips:
      - type: entity
        entity: fan.dmaker_p33_c4d3_fan
        content_info: state
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - type: entity
        entity: fan.zhimi_vb4_00ae_air_purifier
        content_info: state
        tap_action:
          action: more-info
        hold_action:
          action: more-info
      - type: template
        entity: sensor.zhimi_vb4_00ae_temperature
        icon: mdi:thermometer
        content: "{% set v = states('sensor.zhimi_vb4_00ae_temperature') | float(none) %}{{ (v | round(1) ~ '°') if v is not none else '—' }}"
        tap_action:
          action: more-info
      - type: action
        icon: mdi:dots-horizontal
        icon_color: grey
        tap_action:
          action: navigate
          navigation_path: '#living_room_settings'

  #
  # Climate
  #
  - type: custom:bubble-card
    card_type: button
    button_type: state
    entity: sensor.zhimi_vb4_00ae_temperature
    name: Climate
    icon: mdi:home-thermometer
    show_state: true
    tap_action:
      action: more-info
    sub_button:
      - entity: sensor.zhimi_vb4_00ae_relative_humidity
        state_background: false
        icon: mdi:water-percent
        show_state: true
        tap_action:
          action: more-info
      - entity: sensor.zhimi_vb4_00ae_pm25_density
        state_background: false
        icon: mdi:blur
        show_state: true
        tap_action:
          action: more-info
      - entity: sensor.zhimi_vb4_00ae_air_quality
        state_background: false
        icon: mdi:leaf
        show_state: true
        tap_action:
          action: more-info
    styles: |
      .bubble-icon { color: var(--primary-color) !important; }
      .bubble-icon-container { background-color: color-mix(in srgb, var(--primary-color) 20%, transparent) !important; }
      .bubble-sub-button.background-on, .bubble-sub-button.background-on ha-icon, .bubble-sub-button.background-on .bubble-sub-button-icon { color: var(--primary-color); }

  #
  # Devices
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Devices
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-fan-card
        entity: fan.dmaker_p33_c4d3_fan
        name: Standing Fan
        icon_animation: true
        show_percentage_control: true
        collapsible_controls: true
        fill_container: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        features:
          - type: fan-preset-modes
            style: dropdown
      - type: custom:mushroom-entity-card
        entity: fan.zhimi_vb4_00ae_air_purifier
        name: Air Purifier
        secondary_info: state
        fill_container: true
        tap_action:
          action: more-info
        hold_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: switch.xiaomi_iv02_f7b6_pet_drinking_fountain
        name: Pet Fountain
        fill_container: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - type: conditional
        conditions:
          - condition: state
            entity: vacuum.ijai_v3_aaa0_robot_cleaner
            state_not: unavailable
          - condition: state
            entity: vacuum.ijai_v3_aaa0_robot_cleaner
            state_not: unknown
        card:
          type: custom:mushroom-vacuum-card
          entity: vacuum.ijai_v3_aaa0_robot_cleaner
          name: Robot Vacuum
          fill_container: true
          commands:
            - start_pause
            - return_home
          tap_action:
            action: more-info

  #
  # Media: only while a player is reachable
  #
  - type: conditional
    conditions:
      - condition: state
        entity: media_player.living_room_tv_2
        state_not: unavailable
    card:
      type: vertical-stack
      cards:
        - type: custom:decluttering-card
          template: section_title
          variables:
            - title: Media
        - type: custom:mushroom-media-player-card
          entity: media_player.living_room_tv_2
          name: TV
          use_media_info: true
          collapsible_controls: true
          media_controls:
            - play_pause_stop
            - previous
            - next
          volume_controls:
            - volume_mute
            - volume_set
  - type: conditional
    conditions:
      - condition: state
        entity: media_player.google_home_mini
        state_not: unavailable
    card:
      type: custom:mushroom-media-player-card
      entity: media_player.google_home_mini
      name: Google Home Mini
      use_media_info: true
      collapsible_controls: true
      media_controls:
        - play_pause_stop
        - previous
        - next
      volume_controls:
        - volume_mute
        - volume_set

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml

  #
  # Settings popup
  #
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#living_room_settings'
    name: Living Room Settings
    icon: mdi:sofa
    show_header: true
    close_by_clicking_outside: true
    styles: !include /config/dashboards/templates/includes/app_popup_styles.yaml
    margin_top_mobile: max(0px, calc(100vh - 760px))
    margin_top_desktop: max(0px, calc(100vh - 760px))
    cards:
      - type: custom:decluttering-card
        template: section_title
        variables:
          - title: Air Purifier
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: switch.zhimi_vb4_00ae_anion
            name: Negative Ion
            secondary_info: last-changed
            fill_container: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: switch.zhimi_vb4_00ae_physical_control_locked
            name: Child Lock
            secondary_info: last-changed
            fill_container: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.zhimi_vb4_00ae_filter_left_time
            name: Filter Days Left
            fill_container: true
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.zhimi_vb4_00ae_filter_life_level
            name: Filter Life
            fill_container: true
            tap_action:
              action: more-info
      - type: custom:decluttering-card
        template: section_title
        variables:
          - title: Standing Fan
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: switch.dmaker_p33_c4d3_physical_control_locked
            name: Child Lock
            secondary_info: last-changed
            fill_container: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: switch.dmaker_p33_c4d3_alarm
            name: Beep
            secondary_info: last-changed
            fill_container: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: light.dmaker_p33_c4d3_indicator_light
            name: Indicator Light
            secondary_info: last-changed
            fill_container: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
