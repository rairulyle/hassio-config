type: custom:vertical-layout
title: Master Bedroom
path: rooms-master-bedroom
theme: Catppuccin Auto Latte Mocha Dashboard
subview: true
layout: !include /config/dashboards/templates/includes/layouts/app_page_layout.yaml
cards:
  #
  # Chips
  #
  - type: custom:mushroom-chips-card
    card_mod: !include /config/dashboards/templates/includes/card_mod/chips/app_chip_scroll_row.yaml
    chips:
      - type: template
        entity: climate.master_bedroom_aircon
        icon: "{% from 'aircon.jinja' import aircon_icon %}{{ aircon_icon('climate.master_bedroom_aircon') }}"
        icon_color: "{% from 'state_color.jinja' import state_color %}{{ state_color('climate.master_bedroom_aircon') }}"
        content: "{% from 'aircon.jinja' import aircon_label %}{{ aircon_label('climate.master_bedroom_aircon') }}"
        tap_action:
          action: more-info
      - type: template
        entity: sensor.master_bedroom_climate_sensor_temperature
        icon: mdi:thermometer-water
        content: "{{ states('sensor.master_bedroom_climate_sensor_temperature') | float(0) | round(1) }}° · {{ states('sensor.master_bedroom_climate_sensor_humidity') | float(0) | round(0) | int }}%"
        tap_action:
          action: more-info
      - type: template
        entity: lock.master_bedroom_door
        icon: "{{ 'mdi:lock' if is_state('lock.master_bedroom_door','locked') else ('mdi:lock-question' if is_state('lock.master_bedroom_door','unavailable') else 'mdi:lock-open-variant') }}"
        icon_color: "{% from 'state_color.jinja' import state_color %}{{ state_color('lock.master_bedroom_door') }}"
        content: "{{ {'locked':'Locked','unlocked':'Unlocked','locking':'Locking…','unlocking':'Unlocking…','jammed':'Jammed','open':'Open'}.get(states('lock.master_bedroom_door'), 'Offline') }}"
        tap_action:
          action: more-info
      - type: template
        entity: switch.master_bedroom_adaptive_lighting
        icon: "{{ 'mdi:weather-night' if is_state('switch.master_bedroom_adaptive_lighting_sleep_mode','on') else 'mdi:theme-light-dark' }}"
        icon_color: "{% from 'state_color.jinja' import state_color %}{{ state_color('light', states('switch.master_bedroom_adaptive_lighting')) }}"
        content: "{{ 'Manual' if not is_state('switch.master_bedroom_adaptive_lighting','on') else ('Sleep' if is_state('switch.master_bedroom_adaptive_lighting_sleep_mode','on') else 'Adaptive') }}"
        tap_action:
          action: toggle
        double_tap_action:
          action: perform-action
          perform_action: switch.toggle
          target:
            entity_id: switch.master_bedroom_adaptive_lighting_sleep_mode
        hold_action:
          action: more-info
      - type: action
        icon: mdi:dots-horizontal
        icon_color: grey
        tap_action:
          action: navigate
          navigation_path: '#master_bedroom_settings'

  #
  # Aircon
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Aircon
  - type: custom:decluttering-card
    template: aircon_card
    variables:
      - entity: climate.master_bedroom_aircon

  #
  # Lights
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Lights
  - type: custom:decluttering-card
    template: light_row
    variables:
      - entity: light.master_bedroom_all_lights
      - name: All lights
      - icon: mdi:lightbulb-group
      - count_entity: sensor.master_bedroom_lights_on_count
  - type: custom:decluttering-card
    template: light_row
    variables:
      - entity: light.master_bedroom_main_lights
      - name: Main Lights
      - icon: mdi:lightbulb-group
  - type: custom:decluttering-card
    template: light_row
    variables:
      - entity: light.master_bedroom_window_light
      - name: Window Light
  - type: grid
    columns: 3
    square: false
    cards:
      - type: tile
        entity: light.master_bedroom_main_left_light
        name: Left
        icon: mdi:light-recessed
        vertical: true
        hide_state: true
      - type: tile
        entity: light.master_bedroom_main_center_light
        name: Center
        icon: mdi:light-recessed
        vertical: true
        hide_state: true
      - type: tile
        entity: light.master_bedroom_main_right_light
        name: Right
        icon: mdi:light-recessed
        vertical: true
        hide_state: true

  #
  # Security
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Security
  - type: tile
    entity: lock.master_bedroom_door
    name: Door
    vertical: false
    state_content:
      - state
    features:
      - type: lock-commands
    features_position: inline

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml

  #
  # Settings popup
  #
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#master_bedroom_settings'
    name: Master Bedroom Settings
    icon: mdi:bed-king
    show_header: true
    close_by_clicking_outside: true
    styles: !include /config/dashboards/templates/includes/app_popup_styles.yaml
    margin_top_mobile: max(0px, calc(100vh - 760px))
    margin_top_desktop: max(0px, calc(100vh - 760px))
    cards:
      - type: custom:decluttering-card
        template: section_title
        variables:
          - title: Aircon
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: select.master_bedroom_aircon_demand_control
            name: Demand Control
            fill_container: true
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.master_bedroom_aircon_lifetime_outside_energy
            name: Lifetime Energy
            fill_container: true
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: button.master_bedroom_aircon_restart
            name: Restart Controller
            fill_container: true
            tap_action:
              action: more-info
      - type: custom:decluttering-card
        template: section_title
        variables:
          - title: Door Lock
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-number-card
            entity: number.master_bedroom_door_auto_lock_delay
            name: Auto Lock Delay
            display_mode: buttons
            secondary_info: none
            fill_container: true
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: select.master_bedroom_door_double_verification
            name: Double Verification
            fill_container: true
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: select.master_bedroom_door_lock_volume
            name: Lock Volume
            fill_container: true
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.master_bedroom_door_alarm
            name: Lock Alarm
            fill_container: true
            tap_action:
              action: more-info
