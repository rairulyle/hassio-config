type: custom:vertical-layout
title: Master Bedroom
path: rooms-master-bedroom
theme: Catppuccin Auto Latte Mocha Dashboard
subview: true
layout: !include /config/dashboards/templates/includes/layouts/app_page_layout.yaml
cards:
  #
  # Chips
  #
  - type: custom:mushroom-chips-card
    card_mod: !include /config/dashboards/templates/includes/card_mod/chips/app_chip_scroll_row.yaml
    chips:
      - type: template
        entity: light.master_bedroom_lights
        icon: mdi:lightbulb-group
        icon_color: "{{ 'amber' if (expand(['light.master_bedroom_main_left_light', 'light.master_bedroom_main_center_light', 'light.master_bedroom_main_right_light', 'light.master_bedroom_window_light']) | selectattr('state','eq','on') | list | count) > 0 else 'grey' }}"
        content: "{% set n = expand(['light.master_bedroom_main_left_light', 'light.master_bedroom_main_center_light', 'light.master_bedroom_main_right_light', 'light.master_bedroom_window_light']) | selectattr('state','eq','on') | list | count %}{{ (n ~ ' On') if n > 0 else 'Off' }}"
        tap_action:
          action: more-info
      - type: template
        entity: climate.master_bedroom_aircon
        icon: "{{ {'heat_cool':'mdi:sun-snowflake-variant','heat':'mdi:heat-wave','cool':'mdi:snowflake','dry':'mdi:water-percent','fan_only':'mdi:fan'}.get(states('climate.master_bedroom_aircon'), 'mdi:air-conditioner') }}"
        icon_color: "{{ {'heat_cool':'teal','heat':'red','cool':'blue','dry':'cyan','fan_only':'green'}.get(states('climate.master_bedroom_aircon'), 'grey') }}"
        content: "{% set s = states('climate.master_bedroom_aircon') %}{% set t = state_attr('climate.master_bedroom_aircon','temperature') or state_attr('climate.master_bedroom_aircon','current_temperature') %}{{ {'heat_cool':'Auto','heat':'Heat','cool':'Cool','dry':'Dry','fan_only':'Fan','off':'Off','unavailable':'Offline'}.get(s, s) }}{{ (' · ' ~ (t | round(0) | int) ~ '°') if (t and s not in ['off','unavailable']) else '' }}"
        tap_action:
          action: more-info
      - type: template
        entity: lock.master_bedroom_door
        icon: "{{ 'mdi:lock' if is_state('lock.master_bedroom_door','locked') else ('mdi:lock-question' if is_state('lock.master_bedroom_door','unavailable') else 'mdi:lock-open-variant') }}"
        icon_color: "{{ {'locked':'green','jammed':'red','unavailable':'grey'}.get(states('lock.master_bedroom_door'), 'amber') }}"
        content: "{{ {'locked':'Locked','unlocked':'Unlocked','locking':'Locking…','unlocking':'Unlocking…','jammed':'Jammed','open':'Open'}.get(states('lock.master_bedroom_door'), 'Offline') }}"
        tap_action:
          action: more-info
      - type: template
        entity: sensor.master_bedroom_aircon_ac_home
        icon: mdi:thermometer
        content: "{% set v = states('sensor.master_bedroom_aircon_ac_home') | float(none) %}{{ (v | round(1) ~ '°') if v is not none else '—' }}"
        tap_action:
          action: more-info
      - type: action
        icon: mdi:dots-horizontal
        icon_color: grey
        tap_action:
          action: navigate
          navigation_path: '#master_bedroom_settings'

  #
  # Aircon
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Aircon
  - type: custom:mushroom-climate-card
    entity: climate.master_bedroom_aircon
    primary_info: state
    secondary_info: last-changed
    hvac_modes:
      - cool
      - dry
      - fan_only
      - heat_cool
      - "off"
    show_temperature_control: true
    collapsible_controls: true
    tap_action:
      action: more-info
    features:
      - type: climate-fan-modes
        style: dropdown
      - type: climate-swing-modes
        style: dropdown

  #
  # Lights
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Lights
  - type: tile
    entity: light.master_bedroom_main_lights
    name: Main Lights
    icon: mdi:lightbulb-group
    show_entity_picture: false
    hide_state: false
    features:
      - type: light-brightness
    features_position: inline
    vertical: false
  - type: tile
    entity: light.master_bedroom_window_light
    name: Window Light
    icon: mdi:light-recessed
    show_entity_picture: false
    hide_state: false
    features:
      - type: light-brightness
    features_position: inline
    vertical: false

  - type: grid
    columns: 3
    square: false
    cards:
      - type: tile
        entity: light.master_bedroom_main_left_light
        name: Left
        icon: mdi:light-recessed
        vertical: true
        hide_state: true
      - type: tile
        entity: light.master_bedroom_main_center_light
        name: Center
        icon: mdi:light-recessed
        vertical: true
        hide_state: true
      - type: tile
        entity: light.master_bedroom_main_right_light
        name: Right
        icon: mdi:light-recessed
        vertical: true
        hide_state: true

  #
  # Security
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Security
  - type: tile
    entity: lock.master_bedroom_door
    name: Door
    vertical: false
    state_content:
      - state
      - last_changed
    features:
      - type: lock-commands
    features_position: inline

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml

  #
  # Settings popup
  #
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#master_bedroom_settings'
    name: Master Bedroom Settings
    icon: mdi:bed-king
    show_header: true
    close_by_clicking_outside: true
    styles: !include /config/dashboards/templates/includes/app_popup_styles.yaml
    margin_top_mobile: max(0px, calc(100vh - 760px))
    margin_top_desktop: max(0px, calc(100vh - 760px))
    cards:
      - type: custom:decluttering-card
        template: section_title
        variables:
          - title: Aircon
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: select.master_bedroom_aircon_demand_control
            name: Demand Control
            fill_container: true
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.master_bedroom_aircon_lifetime_outside_energy
            name: Lifetime Energy
            fill_container: true
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: button.master_bedroom_aircon_restart
            name: Restart Controller
            fill_container: true
            tap_action:
              action: more-info
      - type: custom:decluttering-card
        template: section_title
        variables:
          - title: Door Lock
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-number-card
            entity: number.master_bedroom_door_auto_lock_delay
            name: Auto Lock Delay
            display_mode: buttons
            secondary_info: none
            fill_container: true
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: select.master_bedroom_door_double_verification
            name: Double Verification
            fill_container: true
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: select.master_bedroom_door_lock_volume
            name: Lock Volume
            fill_container: true
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: sensor.master_bedroom_door_alarm
            name: Lock Alarm
            fill_container: true
            tap_action:
              action: more-info
