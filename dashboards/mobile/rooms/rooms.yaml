  #
  # Carport
  #
  - type: custom:decluttering-card
    template: room_card
    variables:
      - room_name: Carport
      - entity: switch.driveway_gate_unlock
      - icon: mdi:garage-variant
      - navigation_path: /lovelace/rooms-carport
      - camera: camera.carport_carport_camera
      - chips:
        # Last gate operation (no gate sensor yet, so this is the last button pressed).
        # Shows the gate status (Locking/Unlocking/Offline) until the cooldown ends, then Locked/Unlocked.
        - type: template
          entity: input_select.carport_gate_last_operation
          icon: "{{ 'mdi:lock' if is_state('input_select.carport_gate_last_operation', 'Lock') else 'mdi:lock-open-variant' }}"
          icon_color: >
            {% from 'state_color.jinja' import state_color %}{% set s = states('sensor.carport_gate_status') %}
            {{ 'disabled' if s == 'Offline' else state_color('lock', (s if s != 'Ready' else states('input_select.carport_gate_last_operation') ~ 'ed') | lower) }}
          content: >
            {% set s = states('sensor.carport_gate_status') %}{% set l = states('input_select.carport_gate_last_operation') %}
            {{ s if s != 'Ready' else (l ~ 'ed') if l in ['Lock', 'Unlock'] else '—' }}
          tap_action:
            action: more-info
      - room_devices:
        - type: custom:button-card
          template: app_room_card_gate
          entity: sensor.carport_gate_status
          name: Unlock
          icon: mdi:lock-open-variant
          variables:
            script: script.carport_gate
            operation: unlock
        - type: custom:button-card
          template: app_room_card_gate
          entity: sensor.carport_gate_status
          name: Lock
          icon: mdi:lock
          variables:
            script: script.carport_gate
            operation: lock

  #
  # Second Floor
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - icon: mdi:home-floor-2

  #
  # Master Bedroom
  #
  - type: custom:decluttering-card
    template: room_card
    variables:
      - room_name: Master Bedroom
      - entity: light.master_bedroom_all_lights
      - icon: app:app-bed-king
      - navigation_path: /lovelace/rooms-master-bedroom
      - temperature: "[[[ return states['sensor.master_bedroom_climate_sensor_temperature'].state ]]]"
      - humidity: "[[[ return states['sensor.master_bedroom_climate_sensor_humidity'].state ]]]"
      - chips:
        - type: template
          entity: light.master_bedroom_all_lights
          icon: mdi:lightbulb-group
          icon_color: "{% from 'state_color.jinja' import state_color %}{{ state_color('light', 'on' if states('sensor.master_bedroom_lights_on_count') | int(0) > 0 else 'off') }}"
          content: "{% set n = states('sensor.master_bedroom_lights_on_count') | int(0) %}{{ (n ~ ' On') if n > 0 else 'Off' }}"
          tap_action:
            action: more-info
        - type: template
          entity: climate.master_bedroom_aircon
          icon: "{% from 'aircon.jinja' import aircon_icon %}{{ aircon_icon('climate.master_bedroom_aircon') }}"
          icon_color: "{% from 'state_color.jinja' import state_color %}{{ state_color('climate.master_bedroom_aircon') }}"
          content: "{% from 'aircon.jinja' import aircon_label %}{{ aircon_label('climate.master_bedroom_aircon') }}"
          tap_action:
            action: more-info
        - type: template
          entity: lock.master_bedroom_door
          icon: "{{ 'mdi:lock' if is_state('lock.master_bedroom_door','locked') else ('mdi:lock-question' if is_state('lock.master_bedroom_door','unavailable') else 'mdi:lock-open-variant') }}"
          icon_color: "{% from 'state_color.jinja' import state_color %}{{ state_color('lock.master_bedroom_door') }}"
          content: "{{ {'locked':'Locked','unlocked':'Unlocked','locking':'Locking…','unlocking':'Unlocking…','jammed':'Jammed','open':'Open'}.get(states('lock.master_bedroom_door'), 'Offline') }}"
          tap_action:
            action: more-info
      - room_devices:
        - type: custom:button-card
          entity: light.master_bedroom_main_lights
          name: Main
          template: app_room_card_device
          tap_action:
            action: toggle
            haptic: light
          hold_action:
            action: more-info
        - type: custom:button-card
          entity: light.master_bedroom_window_light
          name: Window
          template: app_room_card_device
          tap_action:
            action: toggle
            haptic: light
          hold_action:
            action: more-info
        - type: custom:button-card
          entity: climate.master_bedroom_aircon
          name: Aircon
          template: app_room_card_aircon
        - type: custom:button-card
          entity: lock.master_bedroom_door
          name: Door
          template: app_room_card_device
          tap_action:
            action: more-info
            haptic: light

