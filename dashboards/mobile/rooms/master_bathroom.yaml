type: custom:vertical-layout
title: Master Bathroom
path: rooms-master-bathroom
theme: Catppuccin Mocha Dashboard
subview: true
layout: !include /config/dashboards/templates/includes/layouts/app_page_layout.yaml
cards:
  - type: custom:decluttering-card
    template: top_toolbar
    variables:
      - cards:
        - type: custom:button-card
          template: app_header_chip_card
          icon: mdi:arrow-left
          tap_action:
            action: navigate
            navigation_path: /lovelace/rooms
            haptic: light
        - type: custom:button-card
          template: app_header_page_title
          name: Master Bathroom
        - type: custom:button-card
          template: empty_column

  #
  # Chips
  #
  - type: custom:mod-card
    style: !include /config/dashboards/templates/includes/card_mod/chips/page_chip_layout.yaml
    card:
      type: horizontal-stack
      cards:
        - type: custom:button-card
          template: app_lights_chip
          entity: light.master_bathroom_lights
          variables:
            lights:
              - light.master_bathroom_shower_light
              - light.master_bathroom_door_light

  #
  # Lights
  #
  - type: custom:button-card
    template: section_title
    name: Lights
  - type: tile
    entity: light.master_bathroom_shower_light
    name: Shower Light
    icon: mdi:shower
    show_entity_picture: false
    hide_state: false
    features:
      - type: light-brightness
    features_position: inline
    vertical: false
  - type: tile
    entity: light.master_bathroom_door_light
    name: Door Light
    icon: mdi:door
    show_entity_picture: false
    hide_state: false
    features:
      - type: light-brightness
    features_position: inline
    vertical: false
  - type: tile
    entity: light.master_bathroom_lights
    name: All Lights
    icon: mdi:lightbulb-group
    show_entity_picture: false
    hide_state: false
    features:
      - type: light-color-temp
    features_position: inline
    vertical: false

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml
