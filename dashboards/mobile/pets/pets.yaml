type: custom:vertical-layout
title: Pets
path: pets
theme: Catppuccin Auto Latte Mocha Dashboard
subview: true
layout: !include /config/dashboards/templates/includes/layouts/app_page_layout.yaml
cards:
  #
  # Chips
  #
  - type: custom:mushroom-chips-card
    card_mod: !include /config/dashboards/templates/includes/card_mod/chips/app_chip_scroll_row.yaml
    chips:
      - type: template
        entity: automation.feed_cats
        icon: mdi:clock
        icon_color: "{{ 'green' if is_state('automation.feed_cats','on') else 'grey' }}"
        content: "{{ 'Schedule On' if is_state('automation.feed_cats','on') else 'Schedule Off' }}"
        tap_action:
          action: more-info
      - type: entity
        entity: switch.xiaomi_iv02_f7b6_pet_drinking_fountain
        content_info: state
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - type: action
        icon: mdi:dots-horizontal
        icon_color: grey
        tap_action:
          action: navigate
          navigation_path: '#pets_settings'

  #
  # Feeding
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Cat1, Cat2, & Cat3
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: script.feed_cat
        name: Feed Now
        secondary_info: last-changed
        fill_container: true
        tap_action:
          action: perform-action
          perform_action: script.feed_cat
          confirmation:
            text: Dispense 3 portions from both feeders?
        hold_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: automation.feed_cats
        name: Scheduled Feeding
        fill_container: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - type: custom:mushroom-number-card
        entity: number.pet_feeder_1_feed
        name: Feeder 1 Portions
        display_mode: buttons
        secondary_info: none
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-number-card
        entity: number.pet_feeder_2_feed
        name: Feeder 2 Portions
        display_mode: buttons
        secondary_info: none
        fill_container: true
        tap_action:
          action: more-info

  #
  # Water
  #
  - type: custom:decluttering-card
    template: section_title
    variables:
      - title: Water
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:mushroom-entity-card
        entity: switch.xiaomi_iv02_f7b6_pet_drinking_fountain
        name: Pet Fountain
        fill_container: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.xiaomi_iv02_f7b6_battery_level
        name: Battery
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: sensor.xiaomi_iv02_f7b6_filter_left_time
        name: Filter Days Left
        fill_container: true
        tap_action:
          action: more-info
      - type: custom:mushroom-entity-card
        entity: switch.xiaomi_iv02_f7b6_no_disturb
        name: Quiet Mode
        secondary_info: last-changed
        fill_container: true
        tap_action:
          action: toggle
        hold_action:
          action: more-info

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml

  #
  # Settings popup
  #
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#pets_settings'
    name: Pet Settings
    icon: mdi:cat
    show_header: true
    close_by_clicking_outside: true
    styles: !include /config/dashboards/templates/includes/app_popup_styles.yaml
    margin_top_mobile: max(0px, calc(100vh - 760px))
    margin_top_desktop: max(0px, calc(100vh - 760px))
    cards:
      - type: custom:decluttering-card
        template: section_title
        variables:
          - title: Automations
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: automation.feed_cats
            name: Scheduled Feeding
            secondary_info: last-changed
            fill_container: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: automation.notify_feed_cat1_and_cat2
            name: Feeding Reminders
            secondary_info: last-changed
            fill_container: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
      - type: custom:decluttering-card
        template: section_title
        variables:
          - title: Feeder Status
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: binary_sensor.pet_feeder_1_fault
            name: Feeder 1 Fault
            fill_container: true
            tap_action:
              action: more-info
          - type: custom:mushroom-entity-card
            entity: binary_sensor.pet_feeder_2_fault
            name: Feeder 2 Fault
            fill_container: true
            tap_action:
              action: more-info
