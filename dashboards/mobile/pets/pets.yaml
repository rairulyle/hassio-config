type: custom:vertical-layout
title: Pets
path: pets
theme: Catppuccin Mocha Dashboard
subview: true
layout: !include /config/dashboards/templates/includes/layouts/app_page_layout.yaml
cards:
  - type: custom:decluttering-card
    template: top_toolbar
    variables:
      - cards:
        - type: custom:button-card
          template: empty_column
        - type: custom:button-card
          template: app_header_page_title
          name: Pets
        - type: custom:button-card
          template: app_header_chip_card
          icon: mdi:dots-horizontal
          icon_color: var(--secondary-text-color)
          tap_action:
            action: navigate
            navigation_path: '#pets_settings'
            haptic: light

  #
  # Chips
  #
  - type: custom:mod-card
    style: !include /config/dashboards/templates/includes/card_mod/chips/page_chip_layout.yaml
    card:
      type: horizontal-stack
      cards:
        - type: custom:button-card
          template: app_chip_card
          entity: automation.feed_cats
          icon: mdi:clock-outline
          state_display: >
            [[[ return entity.state == 'on' ? 'Schedule On' : 'Schedule Off'; ]]]
          state:
            - value: "on"
              color: var(--success-color)
            - operator: default
              color: var(--light-grey-color)
        - type: custom:button-card
          template: app_device_chip
          entity: switch.xiaomi_iv02_f7b6_pet_drinking_fountain
          icon: mdi:fountain

  #
  # Feeding
  #
  - type: custom:button-card
    template: section_title
    name: Xiao & Lumine
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        entity: script.feed_cat
        name: Feed Now
        template: app_device_entity
        icon: mdi:cat
        state_display: >
          [[[ return entity.state == 'on' ? 'Feeding…' : `Last fed ${variables.last_changed} ago`; ]]]
        styles:
          icon:
            - color: var(--accent-color)
        tap_action:
          action: perform-action
          perform_action: script.feed_cat
          haptic: medium
          confirmation:
            text: Dispense 3 portions from both feeders?
      - type: custom:button-card
        entity: automation.feed_cats
        name: Scheduled Feeding
        template: app_toggle_entity
        icon: mdi:calendar-clock

  - type: entities
    card_mod: !include /config/dashboards/templates/includes/card_mod/base/app_vertical_stack.yaml
    entities:
      - entity: number.pet_feeder_1_feed
        name: Feeder 1 Portions
        icon: mdi:bowl-mix
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: number.pet_feeder_2_feed
        name: Feeder 2 Portions
        icon: mdi:bowl-mix
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml

  #
  # Water
  #
  - type: custom:button-card
    template: section_title
    name: Water
  - type: grid
    columns: 2
    square: false
    cards:
      - type: custom:button-card
        entity: switch.xiaomi_iv02_f7b6_pet_drinking_fountain
        name: Pet Fountain 2
        template: app_toggle_entity
        icon: mdi:fountain
        state_display: >
          [[[
            const st = states['sensor.xiaomi_iv02_f7b6_status'];
            const s = st ? st.state : entity.state;
            return s.charAt(0).toUpperCase() + s.slice(1) + ` - ${variables.last_changed}`;
          ]]]
      - type: conditional
        conditions:
          - condition: state
            entity: switch.mmgg_wi11_9352_pet_drinking_fountain
            state_not: unavailable
        card:
          type: custom:button-card
          entity: switch.mmgg_wi11_9352_pet_drinking_fountain
          name: Pet Fountain 1
          template: app_toggle_entity
          icon: mdi:fountain

  - type: entities
    card_mod: !include /config/dashboards/templates/includes/card_mod/base/app_vertical_stack.yaml
    entities:
      - entity: binary_sensor.xiaomi_iv02_f7b6_water_shortage_status
        name: Water Level
        icon: mdi:water-alert
        state_color: true
        secondary_info: last-changed
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: sensor.xiaomi_iv02_f7b6_battery_level
        name: Battery
        secondary_info: last-changed
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: sensor.xiaomi_iv02_f7b6_filter_left_time
        name: Filter Days Left
        icon: mdi:air-filter
        card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
      - entity: switch.xiaomi_iv02_f7b6_no_disturb
        name: Quiet Mode
        icon: mdi:sleep
        state_color: true
        card_mod: !include /config/dashboards/templates/includes/app_boolean_entity_layout.yaml

  #
  # Navbar
  #
  - !include /config/dashboards/templates/includes/navbar.yaml

  #
  # Settings popup
  #
  - type: custom:bubble-card
    card_type: pop-up
    hash: '#pets_settings'
    close_by_clicking_outside: true
    styles: !include /config/dashboards/templates/includes/app_popup_styles.yaml
    margin_top_mobile: calc(100vh - 760px)
    margin_top_desktop: calc(100vh - 760px)
    cards:
      - type: custom:button-card
        template: app_popup_page_title
        name: Pet Settings
      - type: custom:button-card
        template: section_title
        name: Automations
      - type: entities
        card_mod: !include /config/dashboards/templates/includes/card_mod/base/app_vertical_stack.yaml
        entities:
          - entity: automation.feed_cats
            name: Scheduled Feeding
            icon: mdi:cat
            card_mod: !include /config/dashboards/templates/includes/app_boolean_entity_layout.yaml
            secondary_info: last-changed
            state_color: true
          - entity: automation.notify_feed_xiao_and_lumine
            name: Feeding Reminders
            icon: app:app-notification
            card_mod: !include /config/dashboards/templates/includes/app_boolean_entity_layout.yaml
            secondary_info: last-changed
            state_color: true
      - type: custom:button-card
        template: section_title
        name: Feeder Status
      - type: entities
        card_mod: !include /config/dashboards/templates/includes/card_mod/base/app_vertical_stack.yaml
        entities:
          - entity: binary_sensor.pet_feeder_1_fault
            name: Feeder 1 Fault
            secondary_info: last-changed
            state_color: true
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
          - entity: binary_sensor.pet_feeder_2_fault
            name: Feeder 2 Fault
            secondary_info: last-changed
            state_color: true
            card_mod: !include /config/dashboards/templates/includes/card_mod/entities/entity_generic_styles.yaml
