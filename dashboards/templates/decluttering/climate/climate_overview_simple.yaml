#
# Climate Overview (adapted): temperature graph + a row of items.
#
# variables:
#   - title (default "Climate"), temperature_sensor
#   - items: list of button-cards (app_aqi_*)
#
climate_overview_simple:
  default:
    - title: Climate
  card:
    type: custom:stack-in-card
    card_mod: !include /config/dashboards/templates/includes/card_mod/climate_card/app_climate_card_stack_styles.yaml
    cards:
      - type: custom:mini-graph-card
        points_per_hour: 2
        hours_to_show: 24
        height: 110
        line_width: 4
        decimals: 1
        smoothing: true
        color_thresholds_transition: smooth
        color_thresholds:
          - color: "#89b4fa"
            value: 20
          - color: "#89dceb"
            value: 24
          - color: "#a6e3a1"
            value: 26
          - color: "#f9e2af"
            value: 29
          - color: "#f38ba8"
            value: 32
        entities:
          - entity: '[[temperature_sensor]]'
        name: '[[title]]'
        icon: mdi:thermometer
        card_mod: !include /config/dashboards/templates/includes/card_mod/climate_card/app_climate_card_graph_styles.yaml

      - type: custom:stack-in-card
        mode: horizontal
        card_mod: !include /config/dashboards/templates/includes/card_mod/base/app_horizontal_stack_bg.yaml
        cards: '[[items]]'
