# Bar icons are all MDI so they share its padding and read the same size; the app: set fills the whole
# 24px box and looks bigger.
type: custom:navbar-card
routes:
  - url: /lovelace/home
    icon: mdi:home-variant
    label: Overview

  - url: /lovelace/rooms
    icon: mdi:view-grid
    label: Rooms
    selected: '[[[ return window.location.pathname.startsWith("/lovelace/rooms") ]]]'
    hold_action:
      action: open-popup
    popup:
      - url: /lovelace/rooms-hallway
        icon: mdi:coat-rack
        label: Hallway
      - url: /lovelace/rooms-master-bedroom
        icon: app:app-bed-king
        label: Master Bedroom
      - url: /lovelace/rooms-master-bathroom
        icon: mdi:shower-head
        label: Master Bathroom
      - url: /lovelace/rooms-bedroom
        icon: app:app-bed-single
        label: Bedroom
      - url: /lovelace/rooms-hobby-room
        icon: mdi:desk
        label: Hobby Room
      - url: /lovelace/rooms-living-room
        icon: app:app-chair
        label: Living Room
      - url: /lovelace/rooms-carport
        icon: mdi:garage-variant
        label: Carport

  - url: /lovelace/pets
    icon: mdi:cat
    label: Pets

  - url: /lovelace/cameras
    icon: mdi:cctv
    label: Cameras

  - icon: mdi:dots-horizontal
    label: More
    tap_action:
      action: open-popup
    popup:
      - icon: mdi:account-circle
        url: /lovelace/people
        label: People
      - icon: mdi:server
        url: /lovelace/system
        label: System

haptic:
  url: true
  tap_action: true
  hold_action: true
  double_tap_action: true
mobile:
  show_labels: false
  show_popup_label_backgrounds: true
styles: |
  /* Floating bar: card radius, inset from the edges, raised above the cards by its own surface,
     shadow and hairline (app-navbar-* theme tokens, set per light/dark mode). */
  .navbar-card {
    border: 1px solid var(--app-navbar-border, transparent);
    background: var(--app-navbar-background, rgba(var(--rgb-card-background-color), 0.94));
    box-shadow: var(--app-navbar-shadow, none);
    backdrop-filter: blur(20px) saturate(1.6);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
    border-radius: var(--ha-card-border-radius, 14px);
    width: calc(100% - 24px);
    margin: 0 auto;
    max-width: 500px;
    bottom: calc(var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px)) + 12px);
    padding: 6px 8px;
  }

  /* Nav buttons are the one exception: no fill behind the active icon, no label; the mauve icon alone marks the view. */
  .button {
    border-radius: 12px;
  }

  .button.active {
    background: transparent;
  }

  .icon {
    fill: rgb(var(--app-icon-shape-off-rgb)) !important;
    color: rgb(var(--app-icon-shape-off-rgb)) !important;
  }

  .icon.active {
    fill: var(--primary-color) !important;
    color: var(--primary-color) !important;
  }



  ha-ripple {
    display: none !important;
  }

  /* More menu: every item stretches to the widest one, and the pills match the cards. */
  .navbar-popup.popuplabelbackground {
    align-items: stretch;
  }

  .popup-item.popuplabelbackground {
    width: auto;
  }

  .navbar-popup .popup-item .button {
    background: var(--card-background-color);
    border-radius: 14px;
    box-shadow: none;
  }

  .navbar-popup .popup-item.active .button {
    background: var(--card-background-color);
    color: var(--primary-color);
  }
