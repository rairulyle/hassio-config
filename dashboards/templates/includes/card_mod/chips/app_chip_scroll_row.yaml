# Chip row (Mushroom chips card): chips never wrap; the row scrolls sideways with no visible scrollbar.
# Chips keep their full width (no shrinking), so a label like "4 On" stays on one line instead of folding.
style: |
  .chip-container {
    flex-wrap: nowrap !important;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .chip-container > * {
    flex-shrink: 0 !important;
    white-space: nowrap;
  }
  .chip-container::-webkit-scrollbar { display: none; }
