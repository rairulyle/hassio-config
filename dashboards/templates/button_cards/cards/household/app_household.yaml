#
# Household header pieces for the Home view.
#

# Attention row: one line per thing that needs a hand. Tap opens the entity dialog.
#   variables.message: what is wrong and what to do
app_attention_row:
  show_state: true
  show_name: true
  show_icon: true
  size: 22px
  variables:
    message: ''
  state_display: "[[[ return variables.message; ]]]"
  styles:
    grid:
      - grid-template-areas: '"i n" "i s"'
      - grid-template-columns: 40px 1fr
      - grid-template-rows: min-content min-content
      - column-gap: 10px
    card:
      - padding: 12px 14px
      - background: rgba(var(--catppuccin-peach-rgb), 0.12)
      - border: 1px solid rgba(var(--catppuccin-peach-rgb), 0.35)
    img_cell:
      - align-self: center
    icon:
      - color: var(--warning-color)
    name:
      - justify-self: start
      - align-self: end
      - font-size: 14px
      - font-weight: 600
      - color: var(--primary-text-color)
    state:
      - justify-self: start
      - align-self: start
      - font-size: 12px
      - color: var(--secondary-text-color)
  tap_action:
    action: more-info
    haptic: light
