# Room card device tile, themed like a vertical Mushroom entity card:
# tinted icon circle on top, name (14/600) and state (12/400) below.
# The icon colour lives on img_cell; the icon inherits it and the disc is that colour at 20%.
# The colour is HA's state colour, worked out like the chips' (custom_templates/state_color.jinja), so don't
# override it per card: a tile and its chip must match.
# Light icons follow one rule: a *_lights id is a group (bulb group), a *_light id is a single fitting (recessed).
# Other devices keep their entity icon; a card can still set its own icon.
app_room_card_device:
  show_state: true
  icon: >
    [[[ if (!entity || !entity.entity_id.startsWith('light.')) return undefined; return entity.entity_id.endsWith('_lights') ? 'mdi:lightbulb-group' : 'mdi:light-recessed'; ]]]
  size: 22px
  variables:
    # same off list and colour chain as custom_templates/state_color.jinja, so a tile matches its chip
    off_states: ['off', 'unavailable', 'unknown', 'idle', 'standby', 'closed', 'not_home', 'docked', 'paused']
  styles:
    grid:
      - grid-template-areas: '"i" "n" "s"'
      - grid-template-rows: min-content min-content min-content
      - row-gap: 4px
    card:
      - background: transparent
      - box-shadow: none
      - padding: 10px 6px 12px
      - border: none
      - backdrop-filter: none
      - -webkit-backdrop-filter: none
      # neutral press/hover feedback, not the icon colour
      - --ha-ripple-color: var(--primary-text-color)
      - --ha-ripple-hover-opacity: 0.04
      - --ha-ripple-pressed-opacity: 0.08
      - --mdc-ripple-color: var(--primary-text-color)
      - --mdc-ripple-hover-opacity: 0.04
    img_cell:
      - justify-self: center
      - width: 42px
      - height: 42px
      - border-radius: 50%
      - color: >
          [[[ if (variables.off_states.includes(entity.state)) return 'rgb(var(--app-icon-shape-off-rgb))'; const d = entity.entity_id.split('.')[0]; return `var(--state-${d}-${entity.state}-color, var(--state-${d}-active-color, var(--state-active-color)))`; ]]]
      - background-color: color-mix(in srgb, currentColor 20%, transparent)
    icon:
      - color: currentColor
    name:
      - color: var(--primary-text-color)
      - font-size: 14px
      - font-weight: 600
      - line-height: 16px
    state:
      - font-weight: 400
      - color: var(--secondary-text-color)
      - font-size: 12px
      - line-height: 14px
  tap_action:
    action: more-info
    haptic: light
