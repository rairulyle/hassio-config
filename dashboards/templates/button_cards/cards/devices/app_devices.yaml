#
# Device tiles adapted for this house.
#

# Aircon tile: handles cool / dry / fan_only / heat / heat_cool / off.
app_ac_entity:
  template: app_device_entity
  icon: >
    [[[
      if (entity.state == "heat_cool") return "mdi:sun-snowflake-variant";
      if (entity.state == "heat") return "mdi:heat-wave";
      if (entity.state == "cool") return "mdi:snowflake";
      if (entity.state == "dry") return "mdi:water-percent";
      if (entity.state == "fan_only") return "mdi:fan";
      return "mdi:air-conditioner";
    ]]]
  state_display: >
    [[[
      const t = entity.attributes.temperature;
      const cur = entity.attributes.current_temperature;
      const target = t ? ` - ${t}°` : (cur ? ` - ${Math.round(cur)}° now` : '');
      if (entity.state == "unavailable") return "Offline";
      if (entity.state == "heat_cool") return `Auto${target}`;
      if (entity.state == "heat") return `Heat${target}`;
      if (entity.state == "cool") return `Cool${target}`;
      if (entity.state == "dry") return `Dry${target}`;
      if (entity.state == "fan_only") return `Fan - ${entity.attributes.fan_mode || ''}`;
      return `Off - ${variables.last_changed}`;
    ]]]
  styles:
    icon:
      - color: >
          [[[
            if (entity.state == "heat_cool") return "var(--state-climate-heat_cool-color)";
            if (entity.state == "heat") return "var(--state-climate-heat-color)";
            if (entity.state == "cool") return "var(--state-climate-cool-color)";
            if (entity.state == "dry") return "var(--info-color)";
            if (entity.state == "fan_only") return "var(--success-color)";
            return "var(--light-grey-color)";
          ]]]

# Fan tile: preset mode and percentage.
app_fan_entity:
  template: app_device_entity
  icon: mdi:fan
  state_display: >
    [[[
      if (entity.state == "unavailable") return "Offline";
      if (entity.state == "on") {
        const p = entity.attributes.percentage;
        const m = entity.attributes.preset_mode;
        return `${m || 'On'}${p ? ' - ' + p + '%' : ''}`;
      }
      return `Off - ${variables.last_changed}`;
    ]]]
  styles:
    icon:
      - color: >
          [[[ return entity.state == "on" ? "var(--primary-color)" : "var(--light-grey-color)"; ]]]

# Generic on/off tile with coloured icon.
app_toggle_entity:
  template: app_device_entity
  tap_action:
    action: toggle
    haptic: light
  hold_action:
    action: more-info
  styles:
    icon:
      - color: >
          [[[ return entity.state == "on" ? "var(--primary-color)" : "var(--light-grey-color)"; ]]]

# Light tile (accent colour when on).
app_light_entity:
  template: app_toggle_entity
  icon: app:app-light
  styles:
    icon:
      - color: >
          [[[ return entity.state == "on" ? "var(--accent-color)" : "var(--light-grey-color)"; ]]]

# Sensor value tile: shows the raw value with its unit.
app_value_entity:
  template: app_device_entity
  state_display: >
    [[[
      if (entity.state == "unavailable" || entity.state == "unknown") return "Unavailable";
      const u = entity.attributes.unit_of_measurement || '';
      const v = isNaN(parseFloat(entity.state)) ? entity.state : Math.round(parseFloat(entity.state) * 10) / 10;
      return `${v}${u ? ' ' + u : ''}`;
    ]]]

# Plain item for the climate row (no AQI dot).
app_plain_item:
  template: app_aqi_item
  variables:
    aqi_status: Good
    unit: ""
  state_display: >
    [[[
      const v = parseFloat(entity.state);
      return isNaN(v) ? entity.state : String(Math.round(v * 10) / 10);
    ]]]
  custom_fields:
    aqi: ""
    unit: "[[[ return variables.unit; ]]]"
