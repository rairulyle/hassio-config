#
# Chips adapted for this house (no occupancy sensors / house modes).
#

# Lights chip: counts bulbs in `variables.lights` that are on.
app_lights_chip:
  template: app_chip_card
  icon: app:app-light
  variables:
    lights: []
  state_display: >
    [[[
      const n = (variables.lights || []).filter(id => states[id] && states[id].state == 'on').length;
      return n > 0 ? `${n} On` : 'Off';
    ]]]
  state:
    - operator: template
      value: "[[[ return (variables.lights || []).some(id => states[id] && states[id].state == 'on') ]]]"
      color: var(--accent-color)
    - operator: default
      color: var(--light-grey-color)
  tap_action:
    action: more-info
    haptic: light

# Aircon chip: mode + current temperature.
app_ac_chip:
  template: app_chip_card
  icon: mdi:air-conditioner
  state_display: >
    [[[
      const s = entity.state;
      if (s == 'unavailable') return 'AC offline';
      if (s == 'off') return 'AC Off';
      const t = entity.attributes.current_temperature;
      const label = s.replace('_', '/').replace('fan/only', 'Fan');
      return `${label.charAt(0).toUpperCase() + label.slice(1)}${t ? ' · ' + Math.round(t) + '°' : ''}`;
    ]]]
  state:
    - value: cool
      color: var(--primary-color)
    - value: heat
      color: var(--error-color)
    - value: dry
      color: var(--info-color)
    - value: heat_cool
      color: var(--success-color)
    - value: fan_only
      color: var(--success-color)
    - operator: default
      color: var(--light-grey-color)
  tap_action:
    action: more-info
    haptic: light

# Generic on/off device chip (fan, purifier, fountain).
app_device_chip:
  template: app_chip_card
  state_display: >
    [[[
      return entity.state == 'on' ? 'On' : (entity.state == 'unavailable' ? 'Offline' : 'Off');
    ]]]
  state:
    - value: "on"
      color: var(--primary-color)
    - operator: default
      color: var(--light-grey-color)
  tap_action:
    action: toggle
    haptic: light
  hold_action:
    action: more-info

# Temperature chip (sensor).
app_temperature_chip:
  template: app_chip_card
  icon: mdi:home-thermometer
  color: var(--light-grey-color)
  state_display: >
    [[[ return Math.round(parseFloat(entity.state) * 10) / 10 + '°'; ]]]
  tap_action:
    action: more-info
    haptic: light
