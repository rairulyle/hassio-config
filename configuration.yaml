# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

# Text to speech
tts:
  - platform: google_translate

frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    - /hacsfiles/lovelace-card-mod/card-mod.js?hacstag=190927524421

xiaomi_miot: !include xiaomi.yaml

wake_on_lan:
rest: !include rest.yaml
rest_command: !include rest_command.yaml
sensor: !include sensor.yaml
switch: !include switch.yaml
template: !include template.yaml
automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
climate: !include climate.yaml
cover: !include cover.yaml

lovelace:
  # Default dashboard (/lovelace) reads the YAML directly: ui-lovelace.yaml and dashboards/.
  # After editing any included file: touch ui-lovelace.yaml, then refresh the page.
  # Frontend resources stay in storage mode so HACS keeps registering them itself.
  dashboards:
    lovelace:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Home
      icon: mdi:view-dashboard
      show_in_sidebar: true

mqtt: !include mqtt.yaml

# Pedestrian gate lock (LOOCK G34A, Tuya category jtmspro). A Wi-Fi low-power lock: it sleeps and only
# talks to the Tuya cloud when woken, so LocalTuya cannot reach it. custom_components/tuya_v2 (a retired
# Tuya domain, kept so the HA brand server shows the Tuya logo) listens to the Tuya message service for
# its reports (every unlock, bell key, alarms, battery) and derives sensor.pedestrian_gate from them and
# the Frigate gate classifier. Status only: the lock cannot be driven from HA.
tuya_v2:
  client_id: !secret tuya_client_id
  client_secret: !secret tuya_client_secret
  region: !secret tuya_region
  locks:
    - device_id: eb9e2652d395294ebbtv9e
      name: Pedestrian Gate
      # Frigate state classifier on the Main Door camera: open / closed / unknown. With it
      # sensor.pedestrian_gate reads "open" while the gate leaf is open; locked = closed and the bolt is back.
      gate_sensor: sensor.porch_main_door_camera_pedestrian_gate_classification
