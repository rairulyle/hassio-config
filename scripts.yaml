turn_off_gaming_pc:
  alias: Turn OFF DESKTOP1 PC
  sequence:
  - service: hassio.addon_stdin
    data:
      addon: core_rpc_shutdown
      input: DESKTOP1
  mode: single
  icon: mdi:youtube-gaming
feed_cat:
  alias: Feed Cats
  description: One meal from both Xiaomi feeders in the master bedroom (each feeder's Target Feeding Measure).
  sequence:
  - action: button.press
    metadata: {}
    data: {}
    target:
      entity_id:
      - button.xiaomi_iv2001_dc59_pet_food_out
      - button.xiaomi_iv2001_f93f_pet_food_out
  mode: single
  icon: mdi:cat
turn_off_desktop2_pc:
  alias: Turn OFF DESKTOP2 PC
  sequence:
  - service: hassio.addon_stdin
    data:
      addon: core_rpc_shutdown
      input: DESKTOP2
  mode: single
  icon: mdi:youtube-gaming
carport_gate:
  alias: Carport - Gate
  description: Locks or unlocks the gate. Ignored while the gate is moving (cooldown)
    or the relay is offline.
  icon: mdi:gate
  mode: single
  max_exceeded: silent
  fields:
    operation:
      name: Operation
      required: true
      selector:
        select:
          options:
          - lock
          - unlock
  sequence:
  - condition: state
    entity_id: timer.carport_gate_cooldown
    state: idle
  - condition: not
    conditions:
    - condition: state
      entity_id: sensor.carport_gate_status
      state: Offline
  - action: input_select.select_option
    target:
      entity_id: input_select.carport_gate_last_operation
    data:
      option: '{{ operation | capitalize }}'
  - action: timer.start
    target:
      entity_id: timer.carport_gate_cooldown
  - action: switch.turn_on
    target:
      entity_id: switch.driveway_gate_{{ operation }}
