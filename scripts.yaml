turn_off_gaming_pc:
  alias: Turn OFF DESKTOP1 PC
  sequence:
  - service: hassio.addon_stdin
    data:
      addon: core_rpc_shutdown
      input: DESKTOP1
  mode: single
  icon: mdi:youtube-gaming
feed_cat:
  alias: Feed Cats
  description: One meal of 5 portions from both Xiaomi feeders in the master bedroom. Sends the
    amount with the feed action because the feeders refuse a Target Feeding Measure below 10.
  sequence:
  - action: xiaomi_miot.call_action
    metadata: {}
    data:
      entity_id:
      - sensor.xiaomi_iv2001_dc59_pet_feeder
      - sensor.xiaomi_iv2001_f93f_pet_feeder
      siid: 2
      aiid: 1
      params:
      - 5
  mode: single
  icon: mdi:cat
turn_off_desktop2_pc:
  alias: Turn OFF DESKTOP2 PC
  sequence:
  - service: hassio.addon_stdin
    data:
      addon: core_rpc_shutdown
      input: DESKTOP2
  mode: single
  icon: mdi:youtube-gaming
carport_gate:
  alias: Carport - Gate
  description: Locks or unlocks the gate. Ignored while the gate is moving (cooldown)
    or the relay is offline.
  icon: mdi:gate
  mode: single
  max_exceeded: silent
  fields:
    operation:
      name: Operation
      required: true
      selector:
        select:
          options:
          - lock
          - unlock
  sequence:
  - condition: state
    entity_id: timer.carport_gate_cooldown
    state: idle
  - condition: not
    conditions:
    - condition: state
      entity_id: sensor.carport_gate_status
      state: Offline
  - action: input_select.select_option
    target:
      entity_id: input_select.carport_gate_last_operation
    data:
      option: '{{ operation | capitalize }}'
  - action: timer.start
    target:
      entity_id: timer.carport_gate_cooldown
  - action: switch.turn_on
    target:
      entity_id: switch.driveway_gate_{{ operation }}
blinds_sheer:
  alias: Blinds - Sheer
  description: Lowers Korean (combi) blinds to where the sheer stripes line up, so the
    room stays private but still gets light. Pass one blind or a room's blind group
    (cover.hobby_room_blinds). Each blind's sheer position is in the sheer variable
    below; nudge it if the stripes don't line up. Offline blinds are skipped.
  icon: mdi:weather-sunny
  mode: parallel
  fields:
    blinds:
      name: Blinds
      description: A blind, or a room's blind group.
      required: true
      selector:
        entity:
          domain: cover
          multiple: true
  variables:
    sheer:
      cover.bedroom_blinds_curtain: 2
      cover.master_bedroom_main_blinds_curtain: 2
      cover.master_bedroom_bedside_blinds_curtain: 2
      cover.hobby_room_main_blinds_curtain: 2
      cover.hobby_room_nook_blinds_curtain: 2
    targets: "{{ expand(blinds) | map(attribute='entity_id') | select('in', sheer) | list }}"
  sequence:
  - repeat:
      for_each: '{{ targets }}'
      sequence:
      - if:
        - condition: template
          value_template: "{{ states(repeat.item) not in ['unavailable', 'unknown'] }}"
        then:
        - action: cover.set_cover_position
          target:
            entity_id: '{{ repeat.item }}'
          data:
            position: '{{ sheer[repeat.item] }}'
