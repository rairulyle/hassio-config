# The cat litter box sensors are UI template helpers (Settings > Helpers), built on custom_templates/litterbox.jinja.

# Per-person location: person.* decides home/away (Companion app GPS only; Bermuda is kept out of
# person on purpose), and while home this adds the room from the phone's Bermuda area. Away shows the zone or Away.
# dashboard_view is the view the dashboard opens on for that person (custom_templates/room_dashboard.jinja).
- sensor:
    - name: Person 1 Location
      unique_id: person1_location
      default_entity_id: sensor.person1_location
      state: >
        {% set person = states('person.person1') %}
        {% set room = states('sensor.person1_ble_phone_area') %}
        {% if person == 'home' %}{{ room if room not in ['unknown', 'unavailable', 'none', ''] else 'Home' }}
        {% elif person in ['not_home', 'unknown', 'unavailable'] %}Away
        {% else %}{{ person }}{% endif %}
      icon: >
        {% set person = states('person.person1') %}
        {% set room = states('sensor.person1_ble_phone_area') %}
        {% if person == 'home' %}{{ (state_attr('sensor.person1_ble_phone_area', 'icon') or 'mdi:home-account') if room not in ['unknown', 'unavailable', 'none', ''] else 'mdi:home' }}
        {% elif person in ['not_home', 'unknown', 'unavailable'] %}mdi:account-arrow-right
        {% else %}mdi:map-marker{% endif %}
      attributes:
        source: "{{ state_attr('person.person1', 'source') }}"
        floor: "{{ state_attr('sensor.person1_ble_phone_area', 'floor_name') }}"
        distance: "{{ states('sensor.person1_ble_phone_distance') }}"
        dashboard_view: "{% from 'room_dashboard.jinja' import room_view %}{{ room_view('person1', 'person1_ble_phone') }}"
    - name: Person 2 Location
      unique_id: person2_location
      default_entity_id: sensor.person2_location
      state: >
        {% set person = states('person.person2') %}
        {% set room = states('sensor.person2_ble_phone_area') %}
        {% if person == 'home' %}{{ room if room not in ['unknown', 'unavailable', 'none', ''] else 'Home' }}
        {% elif person in ['not_home', 'unknown', 'unavailable'] %}Away
        {% else %}{{ person }}{% endif %}
      icon: >
        {% set person = states('person.person2') %}
        {% set room = states('sensor.person2_ble_phone_area') %}
        {% if person == 'home' %}{{ (state_attr('sensor.person2_ble_phone_area', 'icon') or 'mdi:home-account') if room not in ['unknown', 'unavailable', 'none', ''] else 'mdi:home' }}
        {% elif person in ['not_home', 'unknown', 'unavailable'] %}mdi:account-arrow-right
        {% else %}mdi:map-marker{% endif %}
      attributes:
        source: "{{ state_attr('person.person2', 'source') }}"
        floor: "{{ state_attr('sensor.person2_ble_phone_area', 'floor_name') }}"
        distance: "{{ states('sensor.person2_ble_phone_distance') }}"
        dashboard_view: "{% from 'room_dashboard.jinja' import room_view %}{{ room_view('person2', 'person2_ble_phone') }}"

# Each cat's last Frigate sighting per camera, from the "cats" classification model (the sub_label on
# frigate/events). sightings: {camera: {cat: {id, at}}}, at being the event start as a Unix timestamp.
# The litter box push attaches the snapshot of the sighting nearest the visit (pets_litter_box_visit).
- triggers:
    - trigger: mqtt
      topic: frigate/events
      value_template: "{{ value_json.after.label }}"
      payload: cat
  conditions:
    - condition: template
      value_template: "{{ trigger.payload_json.after.sub_label is not none and trigger.payload_json.after.has_snapshot }}"
  sensor:
    - name: Cat Sightings
      unique_id: cat_sightings
      default_entity_id: sensor.cat_sightings
      icon: mdi:cat
      state: >
        {% set sub = trigger.payload_json.after.sub_label %}
        {{ (sub[0] if sub is list else sub) | lower }}
      attributes:
        camera: "{{ trigger.payload_json.after.camera }}"
        sightings: >
          {% set e = trigger.payload_json.after %}
          {% set cat = (e.sub_label[0] if e.sub_label is list else e.sub_label) | lower %}
          {% set all = (this.attributes.sightings if this.attributes.sightings is mapping else {}) %}
          {{ dict(all, **{e.camera: dict(all.get(e.camera, {}), **{cat: {'id': e.id, 'at': e.start_time}})}) }}

# Carport gate as a lock, so it counts with the other locks (chips, Locks pop-up). The relay only takes
# lock/unlock pulses and reports nothing back, so the state is the last operation sent
# (input_select.carport_gate_last_operation), "locking"/"unlocking" while the cooldown timer runs, and
# unavailable while the relay is offline. Lock and unlock run script.carport_gate, which holds the
# cooldown and offline checks; the carport page buttons use the same script.
- lock:
    - name: Carport Gate
      unique_id: carport_gate
      default_entity_id: lock.carport_gate
      availability: "{{ ['switch.driveway_gate_lock', 'switch.driveway_gate_unlock'] | select('has_value') | list | count == 2 }}"
      state: >
        {% set op = states('input_select.carport_gate_last_operation') | lower %}
        {{ (op ~ 'ing') if is_state('timer.carport_gate_cooldown', 'active') else (op ~ 'ed') }}
      lock:
        action: script.carport_gate
        data:
          operation: lock
      unlock:
        action: script.carport_gate
        data:
          operation: unlock
