esphome:
  name: hobby-room-ble-proxy
  friendly_name: Hobby Room - BLE Proxy

esp32:
  board: m5stack-atoms3
  framework:
    type: esp-idf

logger:
api:
  encryption:
    key: !secret ble_proxy_api_key
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 320ms        # ~94% listening; windows over 600ms starve wifi on the
    window: 300ms          # shared radio and cause disconnects

bluetooth_proxy:
  active: true

# Built-in RGB LED. ESPHome leaves it dark unless it's defined here.
# Off by default so it doesn't light up the room at night.
light:
  - platform: esp32_rmt_led_strip
    name: LED
    pin: GPIO35
    num_leds: 1
    chipset: ws2812
    channel_colors: GRB
    restore_mode: RESTORE_DEFAULT_OFF
