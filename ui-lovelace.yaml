# Default dashboard (/lovelace) - YAML mode. Views and templates live under dashboards/.
# After editing any included file, run:  touch ui-lovelace.yaml
title: Home
button_card_templates: !include_dir_merge_named /config/dashboards/templates/button_cards
decluttering_templates: !include_dir_merge_named /config/dashboards/templates/decluttering

views:
  - !include /config/dashboards/mobile/home/home.yaml
  - !include /config/dashboards/mobile/rooms/rooms.yaml
  - !include /config/dashboards/mobile/rooms/living_room.yaml
  - !include /config/dashboards/mobile/rooms/master_bedroom.yaml
  - !include /config/dashboards/mobile/rooms/master_bathroom.yaml
  - !include /config/dashboards/mobile/rooms/bedroom.yaml
  - !include /config/dashboards/mobile/rooms/hobby_room.yaml
  - !include /config/dashboards/mobile/rooms/hallway.yaml
  - !include /config/dashboards/mobile/rooms/carport.yaml
  - !include /config/dashboards/mobile/pets/pets.yaml
  - !include /config/dashboards/mobile/more/cameras.yaml
  - !include /config/dashboards/mobile/more/gate.yaml
  - !include /config/dashboards/mobile/more/people.yaml
  - !include /config/dashboards/mobile/more/system.yaml

# Swipe between views (hass-swipe-navigation). Its own animation stays off: www/dashboard/view_transitions.js
# animates every view change, swipes included, so they all move the same way.
swipe_nav:
  animate: none
  wrap: false
