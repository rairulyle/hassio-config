# Manually defined MQTT entities.
# Aircon entries below are generated with:  bin/add_faikin_aircon.sh "<Name>" <faikin-mqtt-id> <device-id>
# (template: mqtt_templates/faikin_climate.yaml). After changes run the mqtt.reload action.

# ---- Master Bedroom Aircon (Faikin controller "masterbedroom-aircon", device D4059248504C) ----
# Generated by bin/add_faikin_aircon.sh - edit the template in mqtt_templates/ instead.
# Standard Home Assistant values (auto/low/medium/high, off/vertical/horizontal/both) are kept
# so the official thermostat card shows its icons and translations; Daikin-only modes get
# friendly names. Templates translate to/from the raw values the controller expects.
- climate:
    name: Master Bedroom Aircon
    unique_id: faikin_D4059248504C
    device:
      identifiers:
        - D4059248504C
      name: Master Bedroom Aircon
      manufacturer: RevK
      model: Faikin
      configuration_url: http://masterbedroom-aircon.local/
    availability_topic: state/masterbedroom-aircon
    availability_template: "{{ value_json.up }}"
    payload_available: "True"
    payload_not_available: "False"
    temperature_unit: C
    min_temp: 16
    max_temp: 32
    temp_step: 0.5
    modes:
      - heat_cool
      - "off"
      - cool
      - heat
      - dry
      - fan_only
    mode_state_topic: state/masterbedroom-aircon
    mode_state_template: "{{ value_json.mode }}"
    mode_command_topic: command/masterbedroom-aircon/mode
    power_command_topic: command/masterbedroom-aircon/power
    payload_on: "1"
    payload_off: "0"
    temperature_state_topic: state/masterbedroom-aircon
    temperature_state_template: "{{ value_json.target }}"
    temperature_command_topic: command/masterbedroom-aircon/temp
    current_temperature_topic: state/masterbedroom-aircon
    current_temperature_template: "{{ value_json.temp }}"
    fan_modes:
      - auto
      - Night
      - low
      - Low-Medium
      - medium
      - Medium-High
      - high
    fan_mode_state_topic: state/masterbedroom-aircon
    fan_mode_state_template: >-
      {{ {'auto': 'auto', 'night': 'Night', 'low': 'low', 'lowMedium': 'Low-Medium',
          'medium': 'medium', 'mediumHigh': 'Medium-High', 'high': 'high'}.get(value_json.fan, value_json.fan) }}
    fan_mode_command_topic: command/masterbedroom-aircon/fan
    fan_mode_command_template: >-
      {{ {'auto': 'auto', 'Night': 'night', 'low': 'low', 'Low-Medium': 'lowMedium',
          'medium': 'medium', 'Medium-High': 'mediumHigh', 'high': 'high'}.get(value, value) }}
    swing_modes:
      - "off"
      - vertical
      - horizontal
      - both
      - Comfort
    swing_mode_state_topic: state/masterbedroom-aircon
    swing_mode_state_template: >-
      {{ {'off': 'off', 'V': 'vertical', 'H': 'horizontal', 'H+V': 'both', 'C': 'Comfort'}.get(value_json.swing, value_json.swing) }}
    swing_mode_command_topic: command/masterbedroom-aircon/swing
    swing_mode_command_template: >-
      {{ {'off': 'off', 'vertical': 'V', 'horizontal': 'H', 'both': 'H+V', 'Comfort': 'C'}.get(value, value) }}
    preset_modes:
      - eco
      - boost
      - home
    preset_mode_state_topic: state/masterbedroom-aircon
    preset_mode_value_template: "{{ value_json.preset }}"
    preset_mode_command_topic: command/masterbedroom-aircon/preset

